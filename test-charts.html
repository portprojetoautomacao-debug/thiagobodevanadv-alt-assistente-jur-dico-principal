<!DOCTYPE html>
<html>
<head>
    <title>Teste TDZ - Recharts</title>
    <script>
        // Captura erros de TDZ
        window.addEventListener('error', function(e) {
            console.error('ERROR DETECTED:', e.message);
            if (e.message.includes('Cannot access') || e.message.includes('before initialization')) {
                alert('TDZ ERROR DETECTED: ' + e.message);
            }
        });
    </script>
</head>
<body>
    <h1>Teste de TDZ - Recharts</h1>
    <p>Abrindo aplicação em: <a href="http://localhost:4176" target="_blank">http://localhost:4176</a></p>
    <p>Se não houver erro de TDZ no console, o problema foi resolvido!</p>
    <iframe src="http://localhost:4176" width="100%" height="800px"></iframe>
</body>
</html>
