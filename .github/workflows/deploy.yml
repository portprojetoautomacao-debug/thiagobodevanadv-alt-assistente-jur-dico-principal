name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - preview

jobs:
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          ~/.npm
        key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-20-
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint
      continue-on-error: true

    - name: Build application
      run: npm run build
      env:
        VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || 'dummy-client-id' }}
        VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY || 'dummy-api-key' }}
        VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI || 'http://localhost:5173' }}
        VITE_APP_ENV: ${{ github.event_name == 'pull_request' && 'preview' || github.event.inputs.environment || 'production' }}

    - name: Deploy to Vercel
      id: deploy
      run: |
        npm install -g vercel@latest
        
        # Determine deployment type
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "Deploying preview for PR #${{ github.event.pull_request.number }}"
          DEPLOYMENT_URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /dev/stderr | grep -o 'https://[^ ]*' | tail -1)
        elif [[ "${{ github.event.inputs.environment }}" == "production" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "Deploying to production"
          DEPLOYMENT_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /dev/stderr | grep -o 'https://[^ ]*' | tail -1)
        else
          echo "Deploying to staging"
          DEPLOYMENT_URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /dev/stderr | grep -o 'https://[^ ]*' | tail -1)
        fi
        
        echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        echo "Deployment URL: $DEPLOYMENT_URL"
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: Comment deployment URL on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const deploymentUrl = '${{ steps.deploy.outputs.url }}';
          const prNumber = context.issue.number;
          const commitSha = context.sha.substring(0, 7);
          
          const body = `## 🚀 Deploy Preview Ready!
          
          **Preview URL:** ${deploymentUrl}
          
          ### Deployment Details
          - **Environment:** Preview
          - **Commit:** \`${commitSha}\`
          - **Branch:** \`${{ github.head_ref }}\`
          
          ### Quick Links
          - 🔗 [View Preview](${deploymentUrl})
          - 📊 [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          _This preview will be automatically updated with new commits._`;
          
          // Check if there's an existing deployment comment
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber
          });
          
          const botComment = comments.data.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('Deploy Preview Ready')
          );
          
          if (botComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });
          }

  deploy-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: deploy-vercel
    if: always()

    steps:
    - name: Notify deployment status
      run: |
        echo "## 📦 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.deploy-vercel.result }}" == "success" ]]; then
          echo "✅ **Status:** Deployment successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ needs.deploy-vercel.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event_name == 'pull_request' && 'Preview' || github.event.inputs.environment || 'Production' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Visit the deployment URL to verify" >> $GITHUB_STEP_SUMMARY
          echo "- Check application functionality" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor for any runtime errors" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Status:** Deployment failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Troubleshooting" >> $GITHUB_STEP_SUMMARY
          echo "1. Check the build logs above" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify all required secrets are configured" >> $GITHUB_STEP_SUMMARY
          echo "3. Ensure Vercel project is properly linked" >> $GITHUB_STEP_SUMMARY
          echo "4. Check for TypeScript or build errors" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
