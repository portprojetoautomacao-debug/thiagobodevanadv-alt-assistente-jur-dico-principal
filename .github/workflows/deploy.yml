name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
          - preview

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"

jobs:
  # ==========================================
  # 🚀 DEPLOY TO VERCEL
  # ==========================================
  deploy:
    name: "🚀 Deploy to Vercel"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || (github.event.inputs.environment || 'production') }}
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🎯 Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "environment=preview" >> $GITHUB_OUTPUT
            echo "is_production=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.environment }}" != "" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "is_production=${{ github.event.inputs.environment == 'production' }}" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "is_production=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Run linter
        run: npm run lint

      - name: ✅ Validate secrets
        run: |
          MISSING=0
          for secret in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!secret}" ]]; then
              echo "❌ Missing: $secret"
              MISSING=$((MISSING + 1))
            fi
          done
          if [[ $MISSING -gt 0 ]]; then
            echo "::error::$MISSING required secrets are missing. See CONFIGURACAO_VERCEL_TOKEN.md"
            exit 1
          fi
          echo "✅ All Vercel secrets configured"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build application
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || 'dummy-client-id' }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY || 'dummy-api-key' }}
          VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI || 'http://localhost:5173' }}
          VITE_APP_ENV: ${{ steps.env.outputs.environment }}

      - name: 📊 Function count check
        run: |
          COUNT=$(find api -type f -name "*.ts" 2>/dev/null | wc -l)
          echo "## 📊 Serverless Functions" >> $GITHUB_STEP_SUMMARY
          echo "- **Count:** $COUNT/12 (Hobby limit)" >> $GITHUB_STEP_SUMMARY
          if [[ $COUNT -gt 12 ]]; then
            echo "::warning::Exceeding Hobby plan limit ($COUNT/12)"
          fi

      - name: 🚀 Deploy to Vercel
        id: deploy
        run: |
          npm install -g vercel@latest

          PROD_FLAG=""
          if [[ "${{ steps.env.outputs.is_production }}" == "true" ]]; then
            PROD_FLAG="--prod"
            echo "🚀 Deploying to PRODUCTION"
          else
            echo "🚀 Deploying PREVIEW"
          fi

          URL=$(vercel deploy $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | tail -1)

          if [[ -z "$URL" ]]; then
            echo "::error::Failed to get deployment URL"
            exit 1
          fi

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `## 🚀 Deploy Preview Ready!

            **URL:** ${url}
            **Environment:** Preview
            **Commit:** \`${{ github.sha }}\`

            [View Preview](${url}) | [Build Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c => c.body.includes('Deploy Preview Ready'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: 📊 Deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.deploy.outcome }}" == "success" ]]; then
            echo "✅ **Status:** Success" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check [CONFIGURACAO_VERCEL_TOKEN.md](../blob/main/CONFIGURACAO_VERCEL_TOKEN.md)" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # 🎭 E2E TESTS (Post-deploy)
  # ==========================================
  e2e-smoke:
    name: "🎭 E2E Smoke Tests"
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.deploy.result == 'success' && needs.deploy.outputs.url != ''

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium

      - name: ⏳ Wait for deployment
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          echo "Waiting for $URL..."
          for i in {1..30}; do
            if curl -sf "$URL" > /dev/null; then
              echo "✅ Site is up!"
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 5
          done
          echo "::warning::Deployment not responding after 150s"

      - name: 🎭 Run smoke tests
        run: npx playwright test --grep @smoke || echo "⚠️ Some smoke tests failed"
        continue-on-error: true
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}

      - name: 📤 Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: playwright-report/
          retention-days: 7
