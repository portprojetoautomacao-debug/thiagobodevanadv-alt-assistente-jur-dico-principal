name: CI

on:
  push:
    branches: [main, develop, copilot/**]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: "Skip E2E tests"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22.x"
  # Shared environment variables for all jobs
  VITE_APP_ENV: "ci"

jobs:
  # ==========================================
  # 🔍 LINT & TYPE CHECK (Fast feedback)
  # ==========================================
  lint:
    name: "🧹 Lint & Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Run ESLint
        run: npm run lint

      - name: 🔍 TypeScript type check
        run: npx tsc --noEmit --skipLibCheck

  # ==========================================
  # 🏗️ BUILD
  # ==========================================
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    outputs:
      build_success: ${{ steps.build.outcome == 'success' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Cache Vite build
        uses: actions/cache@v4
        with:
          path: |
            .vite
            node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('vite.config.ts', 'package-lock.json') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        id: build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || 'dummy-client-id' }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY || 'dummy-api-key' }}
          VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI || 'http://localhost:5173' }}

      - name: 📊 Build size report
        run: |
          echo "## 📦 Build Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Directory | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| dist/ | $(du -sh dist/ | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| dist/assets/ | $(du -sh dist/assets/ 2>/dev/null | cut -f1 || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Top 5 largest files:" >> $GITHUB_STEP_SUMMARY
          find dist/ -type f -exec du -h {} + | sort -rh | head -5 >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  # ==========================================
  # 🧪 UNIT TESTS
  # ==========================================
  test:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm run test -- --run --coverage

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  # ==========================================
  # 🎭 E2E TESTS (Optional)
  # ==========================================
  e2e:
    name: "🎭 E2E Tests"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    if: ${{ !inputs.skip_e2e }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: 🎭 Run E2E tests
        run: npm run test:e2e
        continue-on-error: true
        env:
          CI: true

      - name: 📤 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ==========================================
  # 🔒 SECURITY AUDIT
  # ==========================================
  security:
    name: "🔒 Security Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 npm audit
        run: |
          npm audit --audit-level=high || {
            echo "::warning::Security vulnerabilities found - review npm audit output"
          }
        continue-on-error: true

      - name: 📊 Security summary
        run: |
          echo "## 🔒 Security Audit Results" >> $GITHUB_STEP_SUMMARY
          npm audit --json 2>/dev/null | jq -r '.metadata | "- Total: \(.totalDependencies) dependencies\n- Vulnerabilities: \(.vulnerabilities.total // 0)"' >> $GITHUB_STEP_SUMMARY || echo "No audit data available" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # ✅ STATUS CHECK
  # ==========================================
  ci-status:
    name: "✅ CI Status"
    runs-on: ubuntu-latest
    needs: [lint, build, test, security]
    if: always()

    steps:
      - name: 📊 Check all jobs
        run: |
          echo "## 📊 CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅' || '❌' }} ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && '✅' || '❌' }} ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result == 'success' && '✅' || '⚠️' }} ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY

          # Fail if critical jobs failed
          if [[ "${{ needs.lint.result }}" != "success" ]] || [[ "${{ needs.build.result }}" != "success" ]]; then
            echo ""
            echo "❌ Critical CI checks failed"
            exit 1
          fi

          echo ""
          echo "✅ All critical CI checks passed!"
