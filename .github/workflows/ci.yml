name: CI

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint
      continue-on-error: false

    - name: Build application
      run: npm run build
      env:
        # Use dummy values for build-time environment variables
        VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || 'dummy-client-id' }}
        VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY || 'dummy-api-key' }}
        VITE_REDIRECT_URI: ${{ secrets.VITE_REDIRECT_URI || 'http://localhost:5173' }}
        VITE_APP_ENV: 'ci'

    - name: Run tests
      run: npm test -- --run
      if: success()
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-${{ matrix.node-version }}
        path: dist/
        retention-days: 7

  lint-security:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Check for outdated dependencies
      run: npm outdated || true
      continue-on-error: true

    - name: Run ESLint with SARIF output
      run: |
        npx eslint . \
          --format @microsoft/eslint-formatter-sarif \
          --output-file eslint-results.sarif
      continue-on-error: true

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: eslint-results.sarif
      continue-on-error: true

  build-matrix-status:
    name: Build Matrix Status
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-and-test, lint-security]
    if: always()

    steps:
    - name: Check build status
      run: |
        if [[ "${{ needs.build-and-test.result }}" == "success" ]]; then
          echo "✅ Build and test passed"
          exit 0
        else
          echo "❌ Build and test failed"
          exit 1
        fi
