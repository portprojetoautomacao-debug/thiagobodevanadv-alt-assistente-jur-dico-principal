  # ==========================================
  # 🧪 UNIT TESTS
  # ==========================================
  test:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm run test -- --run --coverage

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  # ==========================================
  # 🎭 E2E TESTS (Optional)
  # ==========================================
  e2e:
    name: "🎭 E2E Tests"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    if: ${{ !inputs.skip_e2e }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: 🎭 Run E2E tests
        run: npm run test:e2e
        continue-on-error: true
        env:
          CI: true

      - name: 📤 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ==========================================
  # 🔒 SECURITY AUDIT
  # ==========================================
  security:
    name: "🔒 Security Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 npm audit
        run: |
          npm audit --audit-level=high || {
            echo "::warning::Security vulnerabilities found - review npm audit output"
          }
        continue-on-error: true

      - name: 📊 Security summary
        run: |
          echo "## 🔒 Security Audit Results" >> $GITHUB_STEP_SUMMARY
          npm audit --json 2>/dev/null | jq -r '.metadata | "- Total: \(.totalDependencies) dependencies\n- Vulnerabilities: \(.vulnerabilities.total // 0)"' >> $GITHUB_STEP_SUMMARY || echo "No audit data available" >> $GITHUB_STEP_SUMMARY

