name: Agents Integration Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/agents.ts'
      - 'api/cron.ts'
      - 'src/hooks/use-autonomous-agents.ts'
      - 'tests/integration/**'
      - 'lib/api/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api/agents.ts'
      - 'api/cron.ts'
      - 'src/hooks/use-autonomous-agents.ts'
      - 'tests/integration/**'
      - 'lib/api/**'
  workflow_dispatch:

jobs:
  integration-tests:
    name: Agent Flow Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Agent Integration Tests
      run: |
        echo "Running integration tests for Agent Flow..."
        npx vitest run tests/integration/djen-agent-flow.test.ts --reporter=verbose
      env:
        CI: true
