name: Agents Integration Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/agents.ts'
      - 'api/cron.ts'
      - 'src/hooks/use-autonomous-agents.ts'
      - 'tests/integration/**'
      - 'lib/api/**'
      - 'src/lib/agents/todoist-agent.ts'
      - 'src/lib/todoist-integration.ts'
      - 'api/todoist-webhook.ts'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api/agents.ts'
      - 'api/cron.ts'
      - 'src/hooks/use-autonomous-agents.ts'
      - 'tests/integration/**'
      - 'lib/api/**'
      - 'src/lib/agents/todoist-agent.ts'
      - 'src/lib/todoist-integration.ts'
      - 'api/todoist-webhook.ts'
  workflow_dispatch:

concurrency:
  group: agents-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Agent Flow Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Agent Integration Tests
      run: |
        echo "Running integration tests for Agent Flow..."
        
        # Check if test file exists
        if [ -f "tests/integration/djen-agent-flow.test.ts" ]; then
          npx vitest run tests/integration/djen-agent-flow.test.ts --reporter=verbose
        else
          echo "⚠️ Test file not found, skipping integration tests"
          echo "Expected: tests/integration/djen-agent-flow.test.ts"
          exit 0
        fi
      env:
        CI: true

    - name: Run Todoist Agent Tests
      run: |
        echo "Running Todoist Agent tests..."
        npx vitest run src/lib/agents/todoist-agent.test.ts src/lib/todoist-integration.test.ts src/lib/todoist-client.test.ts api/todoist-webhook.test.ts --reporter=verbose
      env:
        CI: true
