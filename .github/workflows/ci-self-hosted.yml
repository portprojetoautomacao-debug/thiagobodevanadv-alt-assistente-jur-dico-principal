name: CI (Self-Hosted Runner)

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: self-hosted
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: ['22.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint || echo "Linting completed with warnings/errors - continuing..."

    - name: Run tests
      run: npm run test

    - name: Build application
      run: npm run build

    - name: Run E2E tests
      run: npm run test:e2e

  # Fallback job caso o self-hosted runner não esteja disponível
  build-fallback:
    name: Build (Fallback)
    runs-on: ubuntu-latest
    if: failure() && contains(needs.build-and-test.result, 'failure')
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build