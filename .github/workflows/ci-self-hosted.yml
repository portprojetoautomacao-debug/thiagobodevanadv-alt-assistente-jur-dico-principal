name: CI

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: ['22.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint || echo "Linting completed with warnings/errors - continuing..."

    - name: Run tests
      run: npm run test

    - name: Build application
      run: npm run build

    - name: Start development server
      run: PORT=5000 npm run dev &
      env:
        PORT: 5000

    - name: Wait for server to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:5000 > /dev/null 2>&1; do sleep 1; done'

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Stop development server
      run: pkill -f "vite"