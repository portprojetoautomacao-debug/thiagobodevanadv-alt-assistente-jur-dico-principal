name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dependabot-auto-merge:
    name: Dependabot Auto-Merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
    - name: Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Auto-merge for minor and patch updates
      if: |
        steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
        steps.metadata.outputs.update-type == 'version-update:semver-patch'
      run: |
        echo "Auto-merging Dependabot PR #${{ github.event.pull_request.number }}"
        echo "Update type: ${{ steps.metadata.outputs.update-type }}"
        echo "Dependency: ${{ steps.metadata.outputs.dependency-names }}"
        gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
    
    - name: Comment on major updates
      if: steps.metadata.outputs.update-type == 'version-update:semver-major'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `⚠️ **Major version update detected**
            
            This PR updates **${{ steps.metadata.outputs.dependency-names }}** to a major version.
            
            **Action Required:**
            - Review the changelog for breaking changes
            - Test the application thoroughly
            - Manually approve and merge when ready
            
            **Update Type:** \`${{ steps.metadata.outputs.update-type }}\`
            
            This PR will NOT be auto-merged. Please review and merge manually.`
          });
    
    - name: Add summary
      if: always()
      run: |
        echo "## 🤖 Dependabot Auto-Merge" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**PR Number:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
        echo "**Dependency:** ${{ steps.metadata.outputs.dependency-names }}" >> $GITHUB_STEP_SUMMARY
        echo "**Update Type:** ${{ steps.metadata.outputs.update-type }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ steps.metadata.outputs.update-type }}" == "version-update:semver-minor" ]] || \
           [[ "${{ steps.metadata.outputs.update-type }}" == "version-update:semver-patch" ]]; then
          echo "✅ **Status:** Auto-merge enabled (will merge after checks pass)" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Status:** Manual review required for major version update" >> $GITHUB_STEP_SUMMARY
        fi
