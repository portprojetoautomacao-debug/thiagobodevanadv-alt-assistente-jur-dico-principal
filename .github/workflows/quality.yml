name: Quality Checks

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '22.x'
        type: string
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'api/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/quality.yml'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '22.x' }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '22.x' }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check for code complexity
        run: |
          echo "🔍 Analyzing code complexity..."
          npx eslint 'src/**/*.{ts,tsx}' 'api/**/*.ts' --ext ts,tsx --max-warnings 150
        continue-on-error: true

      - name: Check for unused exports
        run: |
          echo "🔍 Checking for unused exports..."
          npx ts-prune --error || echo "⚠️ Found unused exports (non-blocking)"
        continue-on-error: true

  code-integrity:
    name: Code Integrity Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version || '22.x' }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check for mock data
        run: |
          echo "🔍 Checking for mock/fake data..."
          ! grep -r "MOCK\|FAKE\|TODO.*remove" src/ api/ || echo "⚠️ Found mock data markers"
        continue-on-error: true

      - name: Verify imports
        run: |
          echo "🔍 Verifying all imports resolve..."
          npm run type-check
