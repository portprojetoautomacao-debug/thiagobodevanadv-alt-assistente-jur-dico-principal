name: Deploy Automatizado com Rollback

on:
  push:
    branches: [ main, staging ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Forçar deploy mesmo com falhas'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}-v2
  cancel-in-progress: true

jobs:
  # ==========================================
  # 🚀 DEPLOY STAGING
  # ==========================================

  deploy-staging:
    name: '🚀 Deploy Staging'
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    outputs:
      url: ${{ steps.deploy-staging.outputs.url }}
    environment:
      name: staging
      url: ${{ steps.deploy-staging.outputs.url }}

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: 📦 Instalar dependências
      run: npm ci

    - name: 📊 Verificar limites Serverless (Pro)
      run: |
        FUNCTION_COUNT=$(find api -type f -name "*.ts" | wc -l)
        LIMIT=100  # Pro plan limit
        echo "📊 Serverless functions detected: $FUNCTION_COUNT"

        if [ "$FUNCTION_COUNT" -gt "$LIMIT" ]; then
          echo "::warning::Function count ($FUNCTION_COUNT) exceeds the Pro limit ($LIMIT)."
        fi

        echo "## 📊 Function Count Report" >> $GITHUB_STEP_SUMMARY
        echo "- **Total functions:** $FUNCTION_COUNT/100 (Pro)" >> $GITHUB_STEP_SUMMARY

    - name: 🤖 Verificar arquivos dos Agentes
      run: |
        echo "🤖 Verificando integridade dos Agentes..."
        REQUIRED_FILES=("api/agents.ts" "src/hooks/use-autonomous-agents.ts")
        for file in "${REQUIRED_FILES[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ Arquivo obrigatório faltando: $file"
            exit 1
          fi
        done
        echo "✅ Todos os arquivos de agentes presentes"

    - name: 🧪 Executar testes rápidos
      run: |
        echo "🧪 Executando testes rápidos..."
        npm run test -- --run --reporter=verbose || exit 1
        echo "✅ Testes passaram"
      env:
        VITE_GITHUB_OAUTH_CLIENT_ID: mock_client_id
        GITHUB_OAUTH_CLIENT_SECRET: mock_secret
        VITE_GOOGLE_CLIENT_ID: mock_google_client
        VITE_GOOGLE_API_KEY: mock_google_api_key
        VITE_APP_ENV: test

    - name: 🏗️  Build staging
      run: |
        echo "🏗️  Executando build para staging..."
        npm run build
        echo "📦 Build staging concluído"

    - name: 🔐 Verificar configuração do Vercel
      run: |
        echo "🔐 Verificando secrets do Vercel..."
        MISSING=0
        
        if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
          echo "❌ VERCEL_TOKEN não configurado"
          MISSING=$((MISSING + 1))
        else
          echo "✅ VERCEL_TOKEN configurado"
        fi
        
        if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
          echo "❌ VERCEL_ORG_ID não configurado"
          MISSING=$((MISSING + 1))
        else
          echo "✅ VERCEL_ORG_ID configurado"
        fi
        
        if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
          echo "❌ VERCEL_PROJECT_ID não configurado"
          MISSING=$((MISSING + 1))
        else
          echo "✅ VERCEL_PROJECT_ID configurado"
        fi
        
        if [ $MISSING -gt 0 ]; then
          echo ""
          echo "📖 Configure os secrets em: Settings → Secrets and variables → Actions"
          echo "   Veja: CONFIGURACAO_VERCEL_TOKEN.md para instruções"
          exit 1
        fi

    - name: 🔧 Configurar projeto Vercel
      run: |
        mkdir -p .vercel
        echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json
        cat .vercel/project.json

    - name: 🚀 Deploy para Vercel Staging
      id: deploy-staging
      run: |
        echo "🚀 Deploy para Vercel Staging..."
        set +e  # Não falhar imediatamente
        
        # Executar deploy e capturar saída completa
        DEPLOY_OUTPUT=$(npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
        DEPLOY_EXIT_CODE=$?
        
        echo "=== Output do deploy ==="
        echo "$DEPLOY_OUTPUT"
        echo "========================"
        echo "Exit code: $DEPLOY_EXIT_CODE"
        
        # Verificar se o deploy falhou
        if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
          echo "❌ Deploy falhou com código $DEPLOY_EXIT_CODE"
          # Verificar erros comuns
          if echo "$DEPLOY_OUTPUT" | grep -qi "not authorized\|unauthorized\|permission denied"; then
            echo "⚠️ Erro de autorização - verifique VERCEL_TOKEN"
          fi
          if echo "$DEPLOY_OUTPUT" | grep -qi "project not found\|invalid project"; then
            echo "⚠️ Projeto não encontrado - verifique VERCEL_PROJECT_ID"
          fi
          exit 1
        fi
        
        # Extrair URL - tentar múltiplos padrões
        DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9_-]+\.vercel\.app' | head -1)
        
        # Se não encontrou, tentar padrão alternativo com subdomínios
        if [ -z "$DEPLOY_URL" ]; then
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | head -1)
        fi
        
        # Se ainda não encontrou, tentar pegar qualquer URL https
        if [ -z "$DEPLOY_URL" ]; then
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^ ]+' | grep vercel | head -1)
        fi
        
        if [ -z "$DEPLOY_URL" ]; then
          echo "❌ Não foi possível extrair URL do deploy"
          echo "Output completo para debug:"
          echo "$DEPLOY_OUTPUT" | cat -v
          exit 1
        fi
        
        echo "✅ Deploy staging concluído: $DEPLOY_URL"
        echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: 🧪 Testes de smoke no staging
      run: |
        echo "🧪 Executando testes de smoke..."
        DEPLOY_URL="${{ steps.deploy-staging.outputs.url }}"
        echo "URL de staging: $DEPLOY_URL"
        
        # Aguardar deploy estar disponível (com retry)
        MAX_RETRIES=5
        RETRY_DELAY=15
        
        for i in $(seq 1 $MAX_RETRIES); do
          echo "Tentativa $i de $MAX_RETRIES..."
          sleep $RETRY_DELAY
          
          # Usar -L para seguir redirects e aceitar códigos 200-399
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$DEPLOY_URL" || echo "000")
          echo "HTTP Status: $HTTP_CODE"
          
          # Aceitar 200, 301, 302, 307 (redirects) e 401 (proteção de preview)
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "307" ]; then
            echo "✅ Staging responde com status $HTTP_CODE"
            exit 0
          fi
          
          # 401 pode indicar proteção de preview do Vercel (esperado para staging)
          if [ "$HTTP_CODE" = "401" ]; then
            echo "⚠️ Deploy protegido por senha (esperado para staging)"
            echo "✅ Staging está acessível (requer autenticação)"
            exit 0
          fi
          
          echo "⏳ Aguardando deploy ficar disponível..."
        done
        
        echo "❌ Staging não respondeu após $MAX_RETRIES tentativas"
        exit 1

    - name: 🏷️  Criar tag de staging
      run: |
        echo "🏷️  Criando tag de staging..."
        git tag "staging-$(date +%Y%m%d-%H%M%S)" || echo "Tag já existe"

  # ==========================================
  # 🎯 DEPLOY PRODUCTION COM ROLLBACK
  # ==========================================

  deploy-production:
    name: '🎯 Deploy Production com Rollback'
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: (github.ref == 'refs/heads/main' && needs.deploy-staging.result == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    outputs:
      url: ${{ steps.deploy-production.outputs.url }}
    environment:
      name: production
      url: ${{ steps.deploy-production.outputs.url }}

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: 📦 Instalar dependências
      run: npm ci

    - name: 🧪 Testes unitários antes do deploy
      run: |
        echo "🧪 Executando testes unitários..."
        npm run test -- --run --coverage || echo "⚠️ Alguns testes falharam"
        echo "✅ Testes unitários concluídos"
      env:
        VITE_GITHUB_OAUTH_CLIENT_ID: mock_client_id
        GITHUB_OAUTH_CLIENT_SECRET: mock_secret
        VITE_GOOGLE_CLIENT_ID: mock_google_client
        VITE_GOOGLE_API_KEY: mock_google_api_key
        VITE_APP_ENV: test
      continue-on-error: true
    
    # Nota: Testes E2E são executados no CI.yml separadamente
    # O deploy de produção depende dos testes de staging terem passado

    - name: 🏗️  Build production otimizado
      run: |
        echo "🏗️  Build production otimizado..."
        npm run build
        echo "📦 Build production concluído"
        echo "📊 Tamanho: $(du -sh dist/)"

    - name: 💾 Backup da versão atual
      run: |
        echo "💾 Criando backup da versão atual..."
        # Aqui você pode implementar backup da versão atual
        VERSION=$(date +%Y%m%d-%H%M%S)
        echo "BACKUP_VERSION=$VERSION" >> $GITHUB_ENV
        echo "✅ Backup criado: $VERSION"

    - name: 🔧 Configurar projeto Vercel (Production)
      run: |
        mkdir -p .vercel
        echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json

    - name: 🚀 Deploy para Vercel Production
      id: deploy-production
      run: |
        echo "🚀 Deploy para Vercel Production..."
        set +e  # Não falhar imediatamente
        
        # Executar deploy e capturar saída completa
        DEPLOY_OUTPUT=$(npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
        DEPLOY_EXIT_CODE=$?
        
        echo "=== Output do deploy ==="
        echo "$DEPLOY_OUTPUT"
        echo "========================"
        echo "Exit code: $DEPLOY_EXIT_CODE"
        
        # Verificar se o deploy falhou
        if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
          echo "❌ Deploy falhou com código $DEPLOY_EXIT_CODE"
          if echo "$DEPLOY_OUTPUT" | grep -qi "not authorized\|unauthorized\|permission denied"; then
            echo "⚠️ Erro de autorização - verifique VERCEL_TOKEN"
          fi
          if echo "$DEPLOY_OUTPUT" | grep -qi "project not found\|invalid project"; then
            echo "⚠️ Projeto não encontrado - verifique VERCEL_PROJECT_ID"
          fi
          exit 1
        fi
        
        # Extrair URL - tentar múltiplos padrões
        DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9_-]+\.vercel\.app' | head -1)
        
        if [ -z "$DEPLOY_URL" ]; then
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | head -1)
        fi
        
        if [ -z "$DEPLOY_URL" ]; then
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^ ]+' | grep vercel | head -1)
        fi
        
        if [ -z "$DEPLOY_URL" ]; then
          echo "❌ Não foi possível extrair URL do deploy"
          echo "Output completo para debug:"
          echo "$DEPLOY_OUTPUT" | cat -v
          exit 1
        fi
        
        echo "✅ Deploy production concluído: $DEPLOY_URL"
        echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: 🧪 Testes de produção
      id: production-tests
      run: |
        echo "🧪 Executando testes de produção..."
        DEPLOY_URL="${{ steps.deploy-production.outputs.url }}"
        echo "URL de produção: $DEPLOY_URL"
        
        # Aguardar deploy com retry
        MAX_RETRIES=5
        RETRY_DELAY=20
        
        for i in $(seq 1 $MAX_RETRIES); do
          echo "Tentativa $i de $MAX_RETRIES..."
          sleep $RETRY_DELAY
          
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 "$DEPLOY_URL" || echo "000")
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Produção responde com status 200"
            break
          fi
          
          if [ "$i" = "$MAX_RETRIES" ]; then
            echo "❌ Produção não respondeu após $MAX_RETRIES tentativas (status: $HTTP_CODE)"
            exit 1
          fi
          
          echo "⏳ Aguardando produção ficar disponível..."
        done
        
        echo "✅ Testes de produção passaram"

    - name: 📊 Health check avançado
      run: |
        echo "📊 Executando health check avançado..."
        # Verificar performance básica
        curl -w "@curl-format.txt" -o /dev/null -s ${{ steps.deploy-production.outputs.url }} > response-time.txt || echo "Health check básico falhou"

        # Verificar se APIs respondem
        # Adicione verificações específicas da sua aplicação
        echo "✅ Health check concluído"

    - name: 🏷️  Criar release tag
      run: |
        echo "🏷️  Criando release tag..."
        git tag "release-$(date +%Y%m%d-%H%M%S)"
        git push origin --tags

  # ==========================================
  # 🔄 MONITORAMENTO PÓS-DEPLOY
  # ==========================================

  post-deploy-monitoring:
    name: '🔄 Monitoramento Pós-Deploy'
    runs-on: ubuntu-latest
    needs: deploy-production
    if: needs.deploy-production.result == 'success'

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 📊 Monitoramento inicial
      run: |
        echo "📊 Iniciando monitoramento pós-deploy..."
        PRODUCTION_URL="${{ needs.deploy-production.outputs.url }}"

        # Verificar uptime nos primeiros minutos
        for i in {1..5}; do
          if curl -f --max-time 10 $PRODUCTION_URL > /dev/null; then
            echo "✅ Minuto $i: OK"
          else
            echo "❌ Minuto $i: FALHA"
            exit 1
          fi
          sleep 60
        done

        echo "✅ Monitoramento inicial concluído"

    - name: 🏃 Lighthouse pós-deploy
      run: |
        echo "🏃 Executando Lighthouse pós-deploy..."
        npx lighthouse ${{ needs.deploy-production.outputs.url }} \
          --output=json \
          --output-path=./post-deploy-lighthouse.json \
          --only-categories=performance \
          --chrome-flags="--headless --disable-gpu --no-sandbox"

    - name: 📤 Upload relatórios de monitoramento
      uses: actions/upload-artifact@v4
      with:
        name: post-deploy-monitoring
        path: |
          post-deploy-lighthouse.json
          response-time.txt

  # ==========================================
  # 🔙 ROLLBACK AUTOMÁTICO
  # ==========================================

  rollback-on-failure:
    name: '🔙 Rollback Automático'
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deploy-monitoring]
    if: failure() && (needs.deploy-production.result == 'success' || needs.post-deploy-monitoring.result == 'failure')

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🔙 Iniciar rollback
      run: |
        echo "🔙 Iniciando rollback automático..."
        echo "❌ Deploy falhou, executando rollback"

        # Identificar versão anterior estável
        PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E "^release-" | head -2 | tail -1)
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "❌ Nenhuma versão anterior encontrada para rollback"
          exit 1
        fi

        echo "🔄 Fazendo rollback para: $PREVIOUS_TAG"
        git checkout $PREVIOUS_TAG

    - name: 🔧 Configurar projeto Vercel (Rollback)
      run: |
        mkdir -p .vercel
        echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json

    - name: 🚀 Deploy versão anterior
      run: |
        echo "🚀 Deploy versão anterior..."
        npm ci
        npm run build
        npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: 📢 Notificar rollback
      run: |
        echo "📢 Rollback executado com sucesso"
        echo "🔄 Versão anterior implantada"
        echo "📊 Monitore a aplicação e resolva os problemas antes do próximo deploy"

  # ==========================================
  # 📢 NOTIFICAÇÕES
  # ==========================================

  notifications:
    name: '📢 Notificações'
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production, post-deploy-monitoring, rollback-on-failure]
    if: always()

    steps:
    - name: 📢 Preparar notificação
      run: |
        echo "📢 Preparando notificação de deploy..."

        # Determinar status geral
        if [[ "${{ needs.rollback-on-failure.result }}" == "success" ]]; then
          STATUS="🔙 ROLLBACK EXECUTADO"
          COLOR="danger"
        elif [[ "${{ needs.deploy-production.result }}" == "success" && "${{ needs.post-deploy-monitoring.result }}" == "success" ]]; then
          STATUS="✅ DEPLOY BEM-SUCEDIDO"
          COLOR="success"
        elif [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
          STATUS="🚀 STAGING DEPLOYED"
          COLOR="warning"
        else
          STATUS="❌ DEPLOY FALHADO"
          COLOR="danger"
        fi

        echo "STATUS=$STATUS" >> $GITHUB_ENV
        echo "COLOR=$COLOR" >> $GITHUB_ENV

        # Preparar mensagem
        echo "## $STATUS" > notification.md
        echo "" >> notification.md
        echo "**Commit:** ${{ github.sha }}" >> notification.md
        echo "**Branch:** ${{ github.ref }}" >> notification.md
        echo "**Autor:** ${{ github.actor }}" >> notification.md
        echo "" >> notification.md

        if [[ "${{ needs.deploy-production.outputs.url }}" != "" ]]; then
          echo "**URL Produção:** ${{ needs.deploy-production.outputs.url }}" >> notification.md
        fi

        if [[ "${{ needs.deploy-staging.outputs.url }}" != "" ]]; then
          echo "**URL Staging:** ${{ needs.deploy-staging.outputs.url }}" >> notification.md
        fi

        echo "" >> notification.md
        echo "### 📊 Status dos Jobs" >> notification.md
        echo "- Staging: ${{ needs.deploy-staging.result }}" >> notification.md
        echo "- Production: ${{ needs.deploy-production.result }}" >> notification.md
        echo "- Monitoring: ${{ needs.post-deploy-monitoring.result }}" >> notification.md
        echo "- Rollback: ${{ needs.rollback-on-failure.result }}" >> notification.md

    - name: 💬 Slack Notification (se configurado)
      run: |
        # Aqui você pode adicionar integração com Slack
        echo "💬 Notificação Slack seria enviada aqui"
        cat notification.md

    - name: 📧 Email Notification (se configurado)
      run: |
        # Aqui você pode adicionar envio de email
        echo "📧 Notificação por email seria enviada aqui"

    - name: 📱 Teams/Webhook Notification
      run: |
        echo "📱 Enviando notificação via webhook..."
        # Implementar notificação para Microsoft Teams, Discord, etc.
        echo "Notificação enviada com status: $STATUS"