name: Copilot Auto Approve

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: copilot-auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-tests:
    name: Check Tests Status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor == 'github-actions[bot]' || github.event.pull_request.user.login == 'github-actions'
    permissions:
      contents: read
    outputs:
      tests-passed: ${{ steps.check-status.outputs.tests-passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q "<<<<<<< "; then
            echo "❌ Merge conflicts detected"
            exit 1
          else
            echo "✅ No merge conflicts"
          fi

      - name: Run lint
        id: check-lint
        run: |
          if npm run lint; then
            echo "lint-passed=true" >> $GITHUB_OUTPUT
          else
            echo "lint-passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Build application
        id: check-build
        run: |
          if npm run build; then
            echo "build-passed=true" >> $GITHUB_OUTPUT
          else
            echo "build-passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        env:
          VITE_GOOGLE_CLIENT_ID: 'dummy-client-id'
          VITE_GOOGLE_API_KEY: 'dummy-api-key'
          VITE_REDIRECT_URI: 'http://localhost:5173'
          VITE_APP_ENV: 'ci'
        continue-on-error: true

      - name: Run tests
        id: check-tests-run
        run: |
          if grep -q "\"test\":" package.json; then
            if npm test -- --run; then
              echo "tests-run-passed=true" >> $GITHUB_OUTPUT
            else
              echo "tests-run-passed=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "tests-run-passed=true" >> $GITHUB_OUTPUT
            echo "⚠️ No test script configured, skipping tests"
          fi
        continue-on-error: true

      - name: Evaluate approval
        id: check-status
        run: |
          LINT_PASSED="${{ steps.check-lint.outputs.lint-passed }}"
          BUILD_PASSED="${{ steps.check-build.outputs.build-passed }}"
          TESTS_PASSED="${{ steps.check-tests-run.outputs.tests-run-passed }}"
          
          if [[ "$LINT_PASSED" == "true" ]] && [[ "$BUILD_PASSED" == "true" ]] && [[ "$TESTS_PASSED" == "true" ]]; then
            echo "tests-passed=true" >> $GITHUB_OUTPUT
            echo "✅ All checks passed - ready for auto-approval"
          else
            echo "tests-passed=false" >> $GITHUB_OUTPUT
            echo "❌ Some checks failed:"
            echo "  - Lint: $LINT_PASSED"
            echo "  - Build: $BUILD_PASSED"
            echo "  - Tests: $TESTS_PASSED"
            exit 1
          fi

  approve-pr:
    name: Approve PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: check-tests
    if: needs.check-tests.outputs.tests-passed == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Approve PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: '✅ Auto-approved by Copilot Auto Approve workflow - all checks passed!'
            })

      - name: Log approval
        run: |
          echo "✅ PR #${{ github.event.pull_request.number }} approved successfully"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Branch: ${{ github.event.pull_request.head.ref }}"
