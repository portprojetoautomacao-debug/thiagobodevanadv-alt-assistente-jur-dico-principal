name: Python Backend CI

on:
  push:
    branches: [main]
    paths:
      - "streamlit-app/backend/**"
      - "streamlit-app/lib/**"
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend FastAPI Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd streamlit-app
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Start backend
        run: |
          cd streamlit-app
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Test backend
        run: |
          cd streamlit-app
          pytest tests/test_backend_api.py -v

      - name: Test agents
        run: |
          cd streamlit-app
          pytest tests/test_agents.py -v
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  lint-python:
    name: Python Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: |
          cd streamlit-app
          ruff check . || true
        continue-on-error: true
