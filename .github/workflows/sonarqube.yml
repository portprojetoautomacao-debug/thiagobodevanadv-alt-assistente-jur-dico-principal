name: SonarQube Analysis
on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage..."
          npm run test:coverage || echo "⚠️ Some tests failed, but coverage was generated"

          # Verificar se coverage foi gerado
          if [ ! -f coverage-api/lcov.info ]; then
            echo "❌ ERROR: coverage-api/lcov.info not found!"
            echo "📋 Creating empty coverage file as fallback..."
            mkdir -p coverage-api
            echo "TN:" > coverage-api/lcov.info
            echo "end_of_record" >> coverage-api/lcov.info
          else
            echo "✅ Coverage file found: coverage-api/lcov.info"
            ls -lh coverage-api/lcov.info
          fi
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        continue-on-error: true

      - name: Check Quality Gate (Non-blocking)
        if: always()
        run: |
          echo "📊 SonarQube analysis completed"
          echo "🔗 View report: https://sonarcloud.io/dashboard?id=thiagobodevanadv-alt_assistente-jur-dico-principal"
          echo "⚠️ Quality Gate failures are informational during development"
          echo "✅ Pipeline continues regardless of Quality Gate status"
