name: SonarQube Analysis

# ⚠️ DESABILITADO TEMPORARIAMENTE - Requer configuração de SONAR_HOST_URL e SONAR_TOKEN
# Para reativar, configure os secrets e descomente a seção 'on:' abaixo

on:
  workflow_dispatch: # Apenas execução manual
  # push:
  #   branches:
  #     - main
  #     - feat/**
  # pull_request:
  #   types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps for DSPy Bridge (FastAPI)
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.110" "uvicorn[standard]>=0.27"
        # Necessário para que tests/integration/dspy-bridge.test.ts consiga iniciar scripts/dspy_bridge.py
        # (o teste em CI exige que o bridge esteja acessível)

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (API)
        env:
          # Token estável para CI. NÃO é segredo; serve apenas para passar autenticação do bridge no teste.
          DSPY_API_TOKEN: "ci-test-token"
        run: |
          echo "🧪 Running API tests with coverage (coverage-api)..."
          npm ci
          npm run test:coverage || echo "⚠️ Some tests failed during coverage but coverage files were generated"
          if [ ! -f coverage-api/lcov.info ]; then
            echo "❌ ERROR: coverage-api/lcov.info not found!"
            exit 1
          fi
          echo "✅ coverage-api/lcov.info found"

      - name: Run tests with coverage (Chrome Extension)
        run: |
          echo "🧪 Running extension tests with coverage (chrome-extension-pje)..."
          if [ -f chrome-extension-pje/package.json ]; then
            pushd chrome-extension-pje
            npm ci
            npm run test:coverage || echo "⚠️ Extension tests/coverage may have failed, but try to continue"
            popd
            if [ ! -f chrome-extension-pje/coverage/lcov.info ]; then
              echo "⚠️ chrome-extension-pje/coverage/lcov.info not found; continuing without extension coverage"
            else
              echo "✅ chrome-extension-pje/coverage/lcov.info found"
            fi
          else
            echo "ℹ️ Chrome extension package not present - skip extension coverage"
          fi

      - name: Merge LCOV files
        run: |
          chmod +x scripts/merge-lcov.sh
          ./scripts/merge-lcov.sh
          echo "✅ Merged LCOV location: coverage/lcov.info"
          ls -lh coverage/lcov.info || true

      - name: SonarQube Scan
        # Nota: SONAR_TOKEN deve estar configurado em Secrets
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        # Importante: tornar o step não fatal temporariamente enquanto corrigimos Quality Gate
        continue-on-error: true

      - name: Check Quality Gate (Non-blocking)
        if: always()
        run: |
          echo "📊 SonarQube analysis completed"
          echo "🔗 View report: https://sonarcloud.io/dashboard?id=thiagobodevanadv-alt_assistente-jur-dico-principal"
          echo "⚠️ Quality Gate failures are informational during development"
          echo "✅ Pipeline continues regardless of Quality Gate status"
