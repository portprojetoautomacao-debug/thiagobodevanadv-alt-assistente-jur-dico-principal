name: 🚀 Codespaces Auto-Setup

on:
  # Trigger ao criar um novo Codespace
  codespace:
  
  # Também pode ser executado manualmente
  workflow_dispatch:

jobs:
  setup-codespace:
    name: Configurar Codespaces para Copilot
    runs-on: ubuntu-latest
    if: github.event_name == 'codespace'
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🔧 Verificar arquivos de configuração
        run: |
          echo "✅ Verificando arquivos de configuração..."
          
          # Verificar se arquivos essenciais existem
          files=(
            ".devcontainer/devcontainer.json"
            ".github/codespaces-settings.json"
            ".github/CODESPACES_SETUP.md"
            ".github/copilot-instructions.md"
            ".vscode/settings.json"
            ".vscode/tasks.json"
            "test-codespaces-config.sh"
          )
          
          missing=()
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Arquivo faltando: $file"
              missing+=("$file")
            else
              echo "✅ $file"
            fi
          done
          
          if [ ${#missing[@]} -ne 0 ]; then
            echo ""
            echo "⚠️  Arquivos faltando:"
            printf '%s\n' "${missing[@]}"
            exit 1
          fi
          
          echo ""
          echo "🎉 Todos os arquivos de configuração estão presentes!"
      
      - name: 🧪 Executar teste de configuração
        run: |
          chmod +x test-codespaces-config.sh
          ./test-codespaces-config.sh
      
      - name: 📊 Resumo da configuração
        if: success()
        run: |
          cat << 'EOF'
          
          ========================================
          🎉 CODESPACE CONFIGURADO COM SUCESSO!
          ========================================
          
          ✅ GitHub Copilot pronto com MÁXIMA AUTONOMIA
          
          O que está ativo:
          - 🤖 Edição automática de arquivos
          - 💻 Terminal com auto-approve
          - 🔧 Coding Agent ativo
          - 💾 Auto-save e auto-format
          - 📝 Git smart commit
          - 🧪 25+ tasks automáticas
          
          📚 Para mais informações:
             .github/CODESPACES_SETUP.md
          
          EOF
      
      - name: ⚠️ Avisos importantes
        if: success()
        run: |
          cat << 'EOF'
          
          ========================================
          ⚠️  LEMBRE-SE
          ========================================
          
          1. Configure GITHUB_TOKEN nos Codespaces Secrets:
             https://github.com/settings/codespaces
          
          2. Copilot precisa de permissões:
             - repo (full control)
             - workflow
             - write:packages
             - read:org
             - gist
          
          3. Teste a configuração:
             ./test-codespaces-config.sh
          
          EOF

  notify-failure:
    name: Notificar falha na configuração
    runs-on: ubuntu-latest
    needs: setup-codespace
    if: failure()
    
    steps:
      - name: ⚠️ Configuração falhou
        run: |
          echo "::warning::Falha ao configurar Codespace para Copilot"
          echo "::warning::Consulte: .github/CODESPACES_SETUP.md#troubleshooting"
