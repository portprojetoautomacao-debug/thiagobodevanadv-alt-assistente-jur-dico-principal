name: Editor Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "src/components/editor/**"
      - "src/components/MinutasManager*.tsx"
      - "src/lib/gemini-service.ts"
      - "src/lib/agents.ts"
      - "tests/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/components/editor/**"
      - "src/components/MinutasManager*.tsx"
  workflow_dispatch:

jobs:
  editor-unit-tests:
    name: Editor Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run editor unit tests
        run: |
          npm run test -- --run \
            --reporter=verbose \
            --coverage \
            tests/components/editor/

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: editor
          name: editor-coverage

  editor-type-check:
    name: Editor Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check editor files
        run: |
          npx tsc --noEmit --skipLibCheck \
            src/components/editor/ProfessionalEditor.tsx \
            src/components/MinutasManagerV2.tsx

  agent-integration-tests:
    name: Agent Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || 'test-key' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run agent integration tests
        run: |
          npm run test -- --run \
            --reporter=verbose \
            tests/agents/ \
            tests/lib/gemini-service.test.ts

      - name: Test streaming functionality
        run: |
          npm run test -- --run \
            --reporter=verbose \
            tests/services/ai-stream.test.ts

  editor-e2e-tests:
    name: Editor E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start dev server
        run: |
          npm run preview &
          npx wait-on http://localhost:4173 -t 30000

      - name: Run editor E2E tests
        run: |
          npm run test:e2e -- \
            --project=chromium \
            tests/e2e/editor*.spec.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  variable-substitution-test:
    name: Variable Substitution Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test variable substitution
        run: |
          cat > test-variables.test.ts << 'EOF'
          import { describe, it, expect } from 'vitest';

          describe('Variable Substitution', () => {
            it('should replace variables correctly', () => {
              const text = 'Cliente: {{nome_cliente}}, CPF: {{cpf_cliente}}';
              const variables = {
                nome_cliente: 'João Silva',
                cpf_cliente: '123.456.789-00'
              };

              let result = text;
              Object.entries(variables).forEach(([key, value]) => {
                const regex = new RegExp(\`\\{\\{\\s*\${key}\\s*\\}\\}\`, 'g');
                result = result.replace(regex, value);
              });

              expect(result).toBe('Cliente: João Silva, CPF: 123.456.789-00');
            });
          });
          EOF

          npx vitest run test-variables.test.ts

  streaming-performance-test:
    name: Streaming Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test streaming performance
        run: |
          cat > test-streaming-perf.test.ts << 'EOF'
          import { describe, it, expect } from 'vitest';

          describe('Streaming Performance', () => {
            it('should handle rapid chunk insertions', async () => {
              const chunks: string[] = [];
              const totalChunks = 100;

              const startTime = Date.now();

              for (let i = 0; i < totalChunks; i++) {
                chunks.push(\`Chunk \${i} \`);
              }

              const endTime = Date.now();
              const duration = endTime - startTime;

              // Should process 100 chunks in less than 100ms
              expect(duration).toBeLessThan(100);
              expect(chunks.length).toBe(totalChunks);
            });

            it('should buffer small chunks efficiently', () => {
              const buffer: string[] = [];
              const BUFFER_SIZE = 5;
              let flushCount = 0;

              const flush = () => {
                if (buffer.length > 0) {
                  flushCount++;
                  buffer.length = 0;
                }
              };

              // Simulate 20 chunks with buffer size 5
              for (let i = 0; i < 20; i++) {
                buffer.push('x');
                if (buffer.length >= BUFFER_SIZE) {
                  flush();
                }
              }
              flush(); // Final flush

              // Should flush 4 times (20 / 5)
              expect(flushCount).toBe(4);
            });
          });
          EOF

          npx vitest run test-streaming-perf.test.ts

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  lint-editor:
    name: Lint Editor Code
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint editor files
        run: |
          npx eslint \
            src/components/editor/ProfessionalEditor.tsx \
            src/components/MinutasManagerV2.tsx \
            --max-warnings 0

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sk dist | cut -f1)
          echo "Bundle size: ${BUNDLE_SIZE}KB"

          # Alert if bundle is larger than 10MB
          if [ $BUNDLE_SIZE -gt 10240 ]; then
            echo "⚠️ Warning: Bundle size is larger than 10MB"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  integration-summary:
    name: Integration Summary
    runs-on: ubuntu-latest
    needs:
      [
        editor-unit-tests,
        editor-type-check,
        agent-integration-tests,
        editor-e2e-tests,
        variable-substitution-test,
        streaming-performance-test,
        security-scan,
        lint-editor,
        build-check,
      ]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## Editor Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Editor Unit Tests | ${{ needs.editor-unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.editor-type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Agent Integration | ${{ needs.agent-integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.editor-e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Variable Substitution | ${{ needs.variable-substitution-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Streaming Performance | ${{ needs.streaming-performance-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint-editor.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-check.result }} |" >> $GITHUB_STEP_SUMMARY
