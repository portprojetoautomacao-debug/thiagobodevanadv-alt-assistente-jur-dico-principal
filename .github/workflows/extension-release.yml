name: Extension Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./chrome-extension-pje

      - name: Validate (typecheck + tests + build)
        run: |
          npm run typecheck
          npm run test -- --coverage
          npm run build
        working-directory: ./chrome-extension-pje

      - name: Package
        run: npm run package
        working-directory: ./chrome-extension-pje

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./chrome-extension-pje/pje-sync-v1.0.0.zip
          asset_name: pje-sync-v1.0.0.zip
          asset_content_type: application/zip

      - name: (Optional) Publish to Chrome Web Store
        run: echo "Add Chrome Web Store publish step here using secrets: CHROME_WEBSTORE_ID and CHROME_WEBSTORE_TOKEN"
