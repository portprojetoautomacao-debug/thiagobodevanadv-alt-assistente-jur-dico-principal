name: Extension Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: ./chrome-extension-pje

      - name: Validate (typecheck + tests + build)
        run: |
          npm run typecheck
          npm run test -- --coverage
          npm run build
        working-directory: ./chrome-extension-pje

      - name: Package
        run: npm run package
        working-directory: ./chrome-extension-pje

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: ./chrome-extension-pje/pje-sync-v1.0.0.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
