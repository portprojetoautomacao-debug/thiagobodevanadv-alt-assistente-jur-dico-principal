name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Run ESLint SARIF
        run: npm run lint:sarif || true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test (unit)
        run: npm run test:run

      - name: Build application
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: "dummy-for-build"
          VITE_GOOGLE_API_KEY: "dummy-for-build"
          VITE_REDIRECT_URI: "http://localhost:5173"
          VITE_APP_ENV: "ci"

  # SonarCloud scan is performed in .github/workflows/sonarcloud.yml
  # SonarQube/Cloud scans should be run separately from the main build workflow
