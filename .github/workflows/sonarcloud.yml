name: SonarCloud Analysis

on:
  push:
    branches: [main, develop, fix/sonar-copilot-assistant]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones disabled for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Build application
        run: npm run build
        continue-on-error: true
        env:
          VITE_GOOGLE_CLIENT_ID: 'dummy-for-build'
          VITE_GOOGLE_API_KEY: 'dummy-for-build'
          VITE_REDIRECT_URI: 'http://localhost:5173'
          VITE_APP_ENV: 'ci'

      - name: Run tests with coverage
        run: npm run test:coverage
        continue-on-error: true
        env:
          CI: true

      - name: SonarCloud Scan
        # Usando SHA completo para segurança (githubactions:S7637)
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        # Usando SHA completo para segurança (githubactions:S7637)
        uses: sonarsource/sonarqube-quality-gate-action@cb3ed20f9fec62b4c3b8ad9e77656c6adaade913 # master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
