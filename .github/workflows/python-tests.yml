name: Python Tests

on:
  push:
    branches: [main]
    paths:
      - "streamlit-app/**/*.py"
      - ".github/workflows/python-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "streamlit-app/**/*.py"
      - ".github/workflows/python-tests.yml"

jobs:
  python-tests:
    name: Testes Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "streamlit-app/requirements.txt"

      - name: Install dependencies
        run: |
          cd streamlit-app
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock

      - name: Run tests
        run: |
          cd streamlit-app
          pytest tests/test_backend_api.py tests/test_e2e.py tests/test_integrations.py tests/test_agents.py tests/test_djen_workflow.py -v --tb=short --cov=. --cov-report=xml --cov-report=term
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: streamlit-app/coverage.xml
          flags: python
        continue-on-error: true

      - name: Test summary
        if: always()
        run: |
          cd streamlit-app
          echo "## 📊 Python Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pytest tests/ --tb=no -q 2>&1 | tail -5 >> $GITHUB_STEP_SUMMARY
