name: Otimização de Performance e Bundle Analysis

on:
  # Removido: push trigger - muito pesado para cada commit
  # Rodar apenas em PRs para main e semanalmente
  pull_request:
    branches: [main]
  schedule:
    # Executar semanalmente nas quartas às 4h UTC
    - cron: "0 4 * * 3"
  workflow_dispatch:
    inputs:
      analysis_type:
        description: "Tipo de análise"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - bundle-only
          - performance-only
          - optimization-only
      baseline_comparison:
        description: "Comparar com baseline"
        required: false
        default: true
        type: boolean

concurrency:
  group: performance-optimization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ==========================================
  # 📦 ANÁLISE DE BUNDLE
  # ==========================================

  bundle-analysis:
    name: "📦 Análise de Bundle"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.analysis_type == 'full' || github.event.inputs.analysis_type == 'bundle-only'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-perf-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-perf-

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 📊 Executar Bundle Analyzer
        run: |
          echo "📊 Executando análise de bundle..."

          # Build com análise de bundle (Vite gera em dist/assets/)
          npm run build

          echo "✅ Build concluído para análise"

      - name: 📏 Analisar Tamanho do Bundle
        run: |
          echo "📏 Analisando tamanho do bundle..."

          # Analisar arquivos do build
          echo "## 📊 Bundle Size Report" > bundle-size-report.md
          echo "" >> bundle-size-report.md
          echo "**Tamanho total do build:**" >> bundle-size-report.md
          du -sh dist/ >> bundle-size-report.md
          echo "" >> bundle-size-report.md

          echo "### 📦 Top 10 maiores arquivos:" >> bundle-size-report.md
          find dist/ -type f -exec ls -lh {} \; | sort -k5 -hr | head -10 >> bundle-size-report.md
          echo "" >> bundle-size-report.md

          # Analisar chunks JavaScript (Vite usa dist/assets/)
          if [ -d "dist/assets" ]; then
            echo "### 🧩 Chunks JavaScript:" >> bundle-size-report.md
            ls -lh dist/assets/*.js 2>/dev/null >> bundle-size-report.md || echo "Nenhum arquivo JS encontrado" >> bundle-size-report.md
            echo "" >> bundle-size-report.md

            echo "### 🎨 Arquivos CSS:" >> bundle-size-report.md
            ls -lh dist/assets/*.css 2>/dev/null >> bundle-size-report.md || echo "Nenhum arquivo CSS encontrado" >> bundle-size-report.md
          fi

          # Calcular tamanhos
          TOTAL_SIZE=$(du -sb dist/ | cut -f1)
          JS_SIZE=$(find dist/assets/ -name "*.js" -exec stat -c%s {} \; 2>/dev/null | awk '{sum += $1} END {print sum+0}')
          CSS_SIZE=$(find dist/assets/ -name "*.css" -exec stat -c%s {} \; 2>/dev/null | awk '{sum += $1} END {print sum+0}')

          echo "" >> bundle-size-report.md
          echo "### 📊 Métricas de tamanho:" >> bundle-size-report.md
          echo "- **Total:** $(numfmt --to=iec-i --suffix=B $TOTAL_SIZE 2>/dev/null || echo "$TOTAL_SIZE bytes")" >> bundle-size-report.md
          echo "- **JavaScript:** $(numfmt --to=iec-i --suffix=B $JS_SIZE 2>/dev/null || echo "$JS_SIZE bytes")" >> bundle-size-report.md
          echo "- **CSS:** $(numfmt --to=iec-i --suffix=B $CSS_SIZE 2>/dev/null || echo "$CSS_SIZE bytes")" >> bundle-size-report.md

          # Adicionar ao step summary
          cat bundle-size-report.md >> $GITHUB_STEP_SUMMARY

          # Salvar métricas para comparação
          {
            echo "total_size: $TOTAL_SIZE"
            echo "js_size: $JS_SIZE"
            echo "css_size: $CSS_SIZE"
            echo "timestamp: $(date +%s)"
            echo "commit: ${{ github.sha }}"
          } > bundle-metrics.json

      - name: 📈 Comparar com Baseline
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.baseline_comparison == true
        run: |
          echo "📈 Comparando com baseline..."

          # Baixar métricas da branch main
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "📥 Baixando métricas da main..."
            gh run download --repo $GITHUB_REPOSITORY --name bundle-metrics -D baseline-metrics/ || echo "Baseline não encontrada"

            if [[ -f baseline-metrics/bundle-metrics.json ]]; then
              BASELINE_TOTAL=$(jq '.total_size' baseline-metrics/bundle-metrics.json)
              BASELINE_JS=$(jq '.js_size' baseline-metrics/bundle-metrics.json)
              BASELINE_CSS=$(jq '.css_size' baseline-metrics/bundle-metrics.json)

              CURRENT_TOTAL=$TOTAL_SIZE
              CURRENT_JS=$JS_SIZE
              CURRENT_CSS=$CSS_SIZE

              # Calcular diferenças
              TOTAL_DIFF=$((CURRENT_TOTAL - BASELINE_TOTAL))
              JS_DIFF=$((CURRENT_JS - BASELINE_JS))
              CSS_DIFF=$((CURRENT_CSS - BASELINE_CSS))

              echo "📊 Comparação com baseline:" >> bundle-size-report.md
              echo "" >> bundle-size-report.md
              echo "| Métrica | Baseline | Atual | Diferença |" >> bundle-size-report.md
              echo "|---------|----------|-------|-----------|" >> bundle-size-report.md
              echo "| Total | $(numfmt --to=iec-i --suffix=B $BASELINE_TOTAL) | $(numfmt --to=iec-i --suffix=B $CURRENT_TOTAL) | $(numfmt --to=iec-i --suffix=B $TOTAL_DIFF) |" >> bundle-size-report.md
              echo "| JS | $(numfmt --to=iec-i --suffix=B $BASELINE_JS) | $(numfmt --to=iec-i --suffix=B $CURRENT_JS) | $(numfmt --to=iec-i --suffix=B $JS_DIFF) |" >> bundle-size-report.md
              echo "| CSS | $(numfmt --to=iec-i --suffix=B $BASELINE_CSS) | $(numfmt --to=iec-i --suffix=B $CURRENT_CSS) | $(numfmt --to=iec-i --suffix=B $CSS_DIFF) |" >> bundle-size-report.md

              # Alertar se aumento significativo
              if [[ $TOTAL_DIFF -gt 100000 ]]; then  # 100KB
                echo "⚠️  ALERTA: Aumento significativo no tamanho do bundle (+$(numfmt --to=iec-i --suffix=B $TOTAL_DIFF))"
              fi
            fi
          fi

      - name: 📤 Upload Relatórios de Bundle
        uses: actions/upload-artifact@v4.4.3
        with:
          name: bundle-reports
          path: |
            bundle-report.html
            bundle-size-report.md
            bundle-metrics.json

  # ==========================================
  # ⚡ ANÁLISE DE PERFORMANCE
  # ==========================================

  performance-analysis:
    name: "⚡ Análise de Performance"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.analysis_type == 'full' || github.event.inputs.analysis_type == 'performance-only'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🏗️  Build de Produção Otimizado
        run: |
          echo "🏗️  Executando build de produção otimizado..."

          # Build com otimizações
          NODE_ENV=production npm run build

      - name: 🖥️  Lighthouse Performance Test
        run: |
          echo "🖥️  Executando Lighthouse performance test..."

          # Instalar servidor local globalmente
          npm install -g serve

          # Verificar se dist/ existe e tem conteúdo
          if [ ! -d "dist" ]; then
            echo "❌ Erro: Diretório dist/ não encontrado"
            exit 1
          fi

          echo "📁 Conteúdo de dist/:"
          ls -la dist/

          # Verificar se há um index.html
          if [ ! -f "dist/index.html" ]; then
            echo "⚠️ Aviso: index.html não encontrado em dist/"
          fi

          # Iniciar servidor com mais opções e redirecionamento adequado
          echo "🚀 Iniciando servidor na porta 3000..."
          serve -s dist -l 3000 --no-port-switching --no-clipboard > serve.log 2>&1 &
          SERVER_PID=$!
          echo "📝 PID do servidor: $SERVER_PID"

          # Aguardar processo estabilizar
          sleep 5

          # Verificar se o processo ainda está rodando
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "❌ Erro: Processo do servidor morreu imediatamente"
            echo "📋 Logs do servidor:"
            cat serve.log || echo "Sem logs disponíveis"
            exit 1
          fi

          # Aguardar servidor iniciar com health check mais robusto
          echo "⏳ Aguardando servidor iniciar..."
          SERVER_READY=false
          for i in {1..30}; do
            if curl -s -f -o /dev/null http://localhost:3000; then
              echo "✅ Servidor respondendo na porta 3000"
              SERVER_READY=true
              break
            fi

            # Verificar se processo ainda existe
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "❌ Servidor morreu durante inicialização (tentativa $i)"
              cat serve.log || echo "Sem logs"
              exit 1
            fi

            echo "Tentativa $i/30: Aguardando servidor..."
            sleep 2
          done

          # Verificar se servidor está acessível
          if [ "$SERVER_READY" = false ]; then
            echo "❌ Erro: Servidor não está acessível em http://localhost:3000"
            echo "📋 Logs do servidor:"
            cat serve.log || echo "Sem logs disponíveis"
            echo "🔍 Processos rodando na porta 3000:"
            lsof -i :3000 || echo "Nenhum processo na porta 3000"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Executar Lighthouse
          echo "🔍 Executando Lighthouse..."
          npx lighthouse http://localhost:3000 \
            --output=json \
            --output-path=lighthouse-performance.json \
            --only-categories=performance \
            --chrome-flags="--headless --disable-gpu --no-sandbox --disable-dev-shm-usage"

          # Matar servidor
          echo "🛑 Encerrando servidor..."
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          # Extrair métricas
          PERFORMANCE_SCORE=$(jq '.categories.performance.score * 100' lighthouse-performance.json)
          FCP=$(jq '.audits."first-contentful-paint".numericValue' lighthouse-performance.json)
          LCP=$(jq '.audits."largest-contentful-paint".numericValue' lighthouse-performance.json)
          TBT=$(jq '.audits."total-blocking-time".numericValue' lighthouse-performance.json)
          CLS=$(jq '.audits."cumulative-layout-shift".numericValue' lighthouse-performance.json)
          SPEED_INDEX=$(jq '.audits."speed-index".numericValue' lighthouse-performance.json)

          echo "📊 Performance Score: $PERFORMANCE_SCORE"
          echo "🖼️  First Contentful Paint: ${FCP}ms"
          echo "🖼️  Largest Contentful Paint: ${LCP}ms"
          echo "⏱️  Total Blocking Time: ${TBT}ms"
          echo "📐 Cumulative Layout Shift: $CLS"
          echo "⚡ Speed Index: ${SPEED_INDEX}ms"

          # Salvar métricas
          {
            echo "performance_score: $PERFORMANCE_SCORE"
            echo "fcp: $FCP"
            echo "lcp: $LCP"
            echo "tbt: $TBT"
            echo "cls: $CLS"
            echo "speed_index: $SPEED_INDEX"
            echo "timestamp: $(date +%s)"
          } > performance-metrics.json

      - name: 📊 Web Vitals Analysis
        run: |
          echo "📊 Analisando Web Vitals..."

          # Verificar se as métricas atendem aos thresholds
          LCP_THRESHOLD=2500  # 2.5s
          FID_THRESHOLD=100   # 100ms
          CLS_THRESHOLD=0.1   # 0.1

          if (( $(echo "$LCP > $LCP_THRESHOLD" | bc -l) )); then
            echo "⚠️  ALERTA: LCP acima do threshold (${LCP}ms > ${LCP_THRESHOLD}ms)"
          fi

          if (( $(echo "$TBT > $FID_THRESHOLD" | bc -l) )); then
            echo "⚠️  ALERTA: TBT acima do threshold (${TBT}ms > ${FID_THRESHOLD}ms)"
          fi

          if (( $(echo "$CLS > $CLS_THRESHOLD" | bc -l) )); then
            echo "⚠️  ALERTA: CLS acima do threshold ($CLS > $CLS_THRESHOLD)"
          fi

      - name: 📈 Comparar Performance com Baseline
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.baseline_comparison == true
        run: |
          echo "📈 Comparando performance com baseline..."

          # Baixar métricas de performance da main
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            gh run download --repo $GITHUB_REPOSITORY --name performance-metrics -D baseline-performance/ || echo "Baseline não encontrada"

            if [[ -f baseline-performance/performance-metrics.json ]]; then
              BASELINE_SCORE=$(jq '.performance_score' baseline-performance/performance-metrics.json)
              BASELINE_LCP=$(jq '.lcp' baseline-performance/performance-metrics.json)

              SCORE_DIFF=$(echo "scale=2; $PERFORMANCE_SCORE - $BASELINE_SCORE" | bc)
              LCP_DIFF=$(echo "scale=2; $LCP - $BASELINE_LCP" | bc)

              echo "📊 Comparação de Performance:" >> performance-report.md
              echo "- **Score:** $BASELINE_SCORE → $PERFORMANCE_SCORE (dif: $SCORE_DIFF)" >> performance-report.md
              echo "- **LCP:** ${BASELINE_LCP}ms → ${LCP}ms (dif: ${LCP_DIFF}ms)" >> performance-report.md
            fi
          fi

      - name: 📤 Upload Relatórios de Performance
        uses: actions/upload-artifact@v4.4.3
        with:
          name: performance-reports
          path: |
            lighthouse-performance.json
            performance-metrics.json
            performance-report.md

  # ==========================================
  # 🔧 OTIMIZAÇÕES DE BUILD
  # ==========================================

  build-optimizations:
    name: "🔧 Otimizações de Build"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.analysis_type == 'full' || github.event.inputs.analysis_type == 'optimization-only'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🏗️ Build (needed for analysis)
        run: |
          echo "🏗️ Executando build de produção (para análise de build / chunks)..."
          NODE_ENV=production npm run build

      - name: 🔍 Analisar Lazy Loading
        run: |
          echo "🔍 Analisando implementação de lazy loading..."
          LAZY_COMPONENTS=$(grep -r "React.lazy\|lazy(" src/components/ 2>/dev/null || true | wc -l)
          TOTAL_COMPONENTS=$(find src/components/ -name "*.tsx" -o -name "*.ts" 2>/dev/null | wc -l)
          echo "📦 Componentes com lazy loading: $LAZY_COMPONENTS / $TOTAL_COMPONENTS"
          if [[ $TOTAL_COMPONENTS -eq 0 ]]; then
            echo "⚠️  Aviso: nenhum componente encontrado em src/components/ — verifique a estrutura do projeto"
          elif [[ $LAZY_COMPONENTS -lt $(($TOTAL_COMPONENTS / 2)) ]]; then
            echo "⚠️  ALERTA: Poucos componentes usam lazy loading"
          fi

      - name: 📊 Analisar Code Splitting
        run: |
          echo "📊 Analisando code splitting..."
          # Prefer legacy create-react-app path, fall back to Vite output
          if [[ -d "dist/static/js" ]]; then
            CHUNK_DIR="dist/static/js"
          elif [[ -d "dist/assets" ]]; then
            CHUNK_DIR="dist/assets"
          else
            CHUNK_DIR=""
          fi
          if [[ -n "$CHUNK_DIR" ]]; then
            CHUNK_COUNT=$(ls -1 "$CHUNK_DIR" 2>/dev/null | wc -l)
          else
            CHUNK_COUNT=0
          fi
          echo "🧩 Número de chunks JavaScript: $CHUNK_COUNT"
          if [[ $CHUNK_COUNT -lt 3 ]]; then
            echo "⚠️  ALERTA: Poucos chunks - considere implementar mais code splitting"
          fi

          # Analisar tamanho dos chunks (if available)
          echo "📏 Tamanhos dos chunks:" > chunk-analysis.md
          if [[ -n "$CHUNK_DIR" ]]; then
            ls -lh "$CHUNK_DIR" >> chunk-analysis.md 2>/dev/null || true
          else
            echo "Nenhum diretório de chunks encontrado (expected dist/static/js or dist/assets)" >> chunk-analysis.md
          fi

      - name: 🗜️  Verificar Compressão
        run: |
          echo "🗜️  Verificando compressão de assets..."
          # find may return nothing; guard so xargs doesn't fail
          ASSET_FILES=$(find dist/ -type f \( -name "*.js" -o -name "*.css" \) 2>/dev/null || true)
          if [[ -z "$ASSET_FILES" ]]; then
            echo "Nenhum asset .js/.css encontrado em dist/ para verificar compressão"
            GZIP_FILES=0
            TOTAL_ASSETS=0
          else
            # Limit to first 100 to avoid long output
            TOTAL_ASSETS=$(echo "$ASSET_FILES" | wc -l)
            GZIP_FILES=$(echo "$ASSET_FILES" | head -100 | xargs file 2>/dev/null | grep -c "gzip" || true)
          fi
          echo "🗜️  Arquivos comprimidos: $GZIP_FILES / $TOTAL_ASSETS"
          if [[ $TOTAL_ASSETS -eq 0 ]]; then
            echo "⚠️  Aviso: nenhum asset encontrado para checar compressão"
          elif [[ $GZIP_FILES -eq 0 ]]; then
            echo "⚠️  ALERTA: Assets não estão comprimidos"
          fi

      - name: 🌐 Verificar CDN e Cache Headers
        run: |
          echo "🌐 Verificando configuração de CDN e cache..."

          # Verificar se há configuração de CDN no build
          if [[ -f dist/_headers ]]; then
            echo "✅ Headers de cache configurados"
            cat dist/_headers
          else
            echo "⚠️  Headers de cache não configurados"
          fi

      - name: 📋 Gerar Relatório de Otimizações
        run: |
          echo "📋 Gerando relatório de otimizações..."

          {
            echo "# 🔧 Relatório de Otimizações de Build"
            echo ""
            echo "**Data:** $(date)"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "## 📦 Code Splitting"
            echo "- Chunks JavaScript: $CHUNK_COUNT"
            echo "- Componentes lazy: $LAZY_COMPONENTS / $TOTAL_COMPONENTS"
            echo ""
            echo "## 🗜️  Compressão"
            echo "- Assets comprimidos: $GZIP_FILES / $TOTAL_ASSETS"
            echo ""
            echo "## ⚡ Performance"
            echo "- Performance Score: $PERFORMANCE_SCORE"
            echo "- Bundle Size: $(numfmt --to=iec-i --suffix=B $TOTAL_SIZE)"
            echo ""
          } > optimization-report.md

      - name: 📤 Upload Relatórios de Otimização
        uses: actions/upload-artifact@v4.4.3
        with:
          name: optimization-reports
          path: |
            chunk-analysis.md
            optimization-report.md

  # ==========================================
  # 📊 DASHBOARD DE PERFORMANCE
  # ==========================================

  performance-dashboard:
    name: "📊 Dashboard de Performance"
    runs-on: ubuntu-latest
    needs: [bundle-analysis, performance-analysis, build-optimizations]
    if: always()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📊 Gerar Dashboard Consolidado
        run: |
          echo "📊 Gerando dashboard de performance consolidado..."

          # Criar dashboard markdown
          {
            echo "# 📊 Dashboard de Performance e Bundle"
            echo ""
            echo "**Commit:** ${{ github.sha }}"
            echo "**Branch:** ${{ github.ref }}"
            echo "**Data:** $(date)"
            echo ""
            echo "## 📦 Status das Análises"
            echo ""
            echo "| Análise | Status |"
            echo "|---------|--------|"
            echo "| Bundle Analysis | ${{ needs.bundle-analysis.result }} |"
            echo "| Performance Analysis | ${{ needs.performance-analysis.result }} |"
            echo "| Build Optimizations | ${{ needs.build-optimizations.result }} |"
            echo ""
          } > performance-dashboard.md

          # Determinar status geral
          if [[ "${{ needs.bundle-analysis.result }}" == "success" && \
                "${{ needs.performance-analysis.result }}" == "success" && \
                "${{ needs.build-optimizations.result }}" == "success" ]]; then
            echo "## ✅ STATUS GERAL: PERFORMANCE OTIMIZADA" >> performance-dashboard.md
            echo "STATUS=success" >> $GITHUB_ENV
          else
            echo "## ⚠️  STATUS GERAL: OPORTUNIDADES DE OTIMIZAÇÃO" >> performance-dashboard.md
            echo "STATUS=warning" >> $GITHUB_ENV
          fi

          # Adicionar métricas de performance se disponíveis
          if [[ -f performance-metrics.json ]]; then
            SCORE=$(jq -r '.performance_score' performance-metrics.json 2>/dev/null || echo "N/A")
            LCP=$(jq -r '.lcp' performance-metrics.json 2>/dev/null || echo "N/A")
            echo "" >> performance-dashboard.md
            echo "## ⚡ Métricas de Performance" >> performance-dashboard.md
            echo "- **Performance Score:** $SCORE" >> performance-dashboard.md
            echo "- **Largest Contentful Paint:** ${LCP}ms" >> performance-dashboard.md
          fi

          # Adicionar métricas de bundle se disponíveis
          if [[ -f bundle-metrics.json ]]; then
            TOTAL_SIZE=$(jq -r '.total_size' bundle-metrics.json 2>/dev/null || echo "N/A")
            if [[ "$TOTAL_SIZE" != "N/A" ]]; then
              echo "- **Tamanho do Bundle:** $(numfmt --to=iec-i --suffix=B $TOTAL_SIZE)" >> performance-dashboard.md
            fi
          fi

          echo "" >> performance-dashboard.md
          echo "## 📋 Recomendações de Otimização" >> performance-dashboard.md
          echo "" >> performance-dashboard.md

          # Adicionar recomendações baseadas nos resultados
          if [[ "${{ needs.bundle-analysis.result }}" != "success" ]]; then
            echo "- 📦 **Otimizar bundle** - Implementar code splitting e lazy loading" >> performance-dashboard.md
          fi

          if [[ "${{ needs.performance-analysis.result }}" != "success" ]]; then
            echo "- ⚡ **Melhorar performance** - Otimizar imagens, reduzir blocking time" >> performance-dashboard.md
          fi

          if [[ "${{ needs.build-optimizations.result }}" != "success" ]]; then
            echo "- 🔧 **Otimizar build** - Configurar compressão e cache headers" >> performance-dashboard.md
          fi

          echo "" >> performance-dashboard.md
          echo "*Dashboard gerado automaticamente*" >> performance-dashboard.md

      - name: 📥 Checkout código (para permitir gh operar no contexto do repo)
        uses: actions/checkout@v4

      - name: 💬 Comentar Performance no PR
        if: github.event_name == 'pull_request'
        run: |
          echo "💬 Comentando performance no PR..."

          # Criar comentário
          COMMENT="## ⚡ Análise de Performance

          **Status:** $STATUS

          ### 📊 Métricas Principais
          - **Performance Score:** $SCORE
          - **Bundle Size:** $(numfmt --to=iec-i --suffix=B $TOTAL_SIZE)
          - **LCP:** ${LCP}ms"

          # Adicionar aviso se houver oportunidades de otimização
          if [[ "$STATUS" != "success" ]]; then
            COMMENT="$COMMENT

          **⚠️  Oportunidades de otimização identificadas. Verifique os artefatos para detalhes.**"
          fi

          COMMENT="$COMMENT

          Verifique os relatórios completos nos artefatos do workflow."

          # Comentar no PR (checkout para garantir .git e contexto disponível)
          echo "📥 Fazendo checkout do código para permitir 'gh' operar no contexto" >&2
          git --version || true
          # Usamos actions/checkout local step para obter .git — se o job não tiver efetuado checkout, usamos gh --repo fallback
          if [ -d .git ]; then
            PR_NUMBER=${{ github.event.number }}
            echo "$COMMENT" | gh pr comment $PR_NUMBER --body-file -
          else
            # Fallback: passar --repo para gh para não depender de .git
            PR_NUMBER=${{ github.event.number }}
            echo "$COMMENT" | gh pr comment $PR_NUMBER --repo "$GITHUB_REPOSITORY" --body-file -
          fi

      - name: 📤 Upload Dashboard de Performance
        uses: actions/upload-artifact@v4.4.3
        with:
          name: performance-dashboard
          path: performance-dashboard.md

  # ==========================================
  # 📢 NOTIFICAÇÕES DE PERFORMANCE
  # ==========================================

  performance-notifications:
    name: "📢 Notificações de Performance"
    runs-on: ubuntu-latest
    needs: performance-dashboard
    if: always()

    steps:
      - name: 📢 Preparar Notificações de Performance
        run: |
          echo "📢 Preparando notificações de performance..."

          # Criar notificação baseada no status
          if [[ "$STATUS" == "success" ]]; then
            TITLE="✅ Performance Otimizada"
            MESSAGE="Análise de performance concluída com sucesso. Bundle e performance dentro dos parâmetros."
            PRIORITY="normal"
          else
            TITLE="⚡ Oportunidades de Otimização de Performance"
            MESSAGE="Foram identificadas oportunidades de melhoria na performance e tamanho do bundle."
            PRIORITY="normal"
          fi

          # Criar payload de notificação
          {
            echo "title: \"$TITLE\""
            echo "message: \"$MESSAGE\""
            echo "priority: \"$PRIORITY\""
            echo "timestamp: \"$(date -Iseconds)\""
            echo "performance_score: \"$SCORE\""
            echo "bundle_size: \"$TOTAL_SIZE\""
          } > performance-notification.json

      - name: 💬 Slack Notification
        run: |
          echo "💬 Enviando notificação para Slack..."
          # Implementar webhook do Slack

      - name: 📧 Email Notification
        run: |
          echo "📧 Enviando notificação por email..."
          # Implementar serviço de email

      - name: 📱 Teams Notification
        run: |
          echo "📱 Enviando notificação para Teams..."
          # Implementar webhook do Teams

      - name: 📤 Upload Notificações
        uses: actions/upload-artifact@v4.4.3
        with:
          name: performance-notifications
          path: performance-notification.json
