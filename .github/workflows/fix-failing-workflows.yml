name: Fix Failing Workflows

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        description: "Nome do workflow para corrigir (deixe vazio para todos)"
        required: false
        type: string
  schedule:
    # Roda todo dia às 02:00 (horário de Brasília)
    - cron: "0 5 * * *" # 05:00 UTC = 02:00 BRT

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  detect-failing-workflows:
    name: Detectar Workflows com Falhas
    runs-on: ubuntu-latest
    outputs:
      failing_workflows: ${{ steps.detect.outputs.workflows }}
      has_failures: ${{ steps.detect.outputs.has_failures }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar workflows com falhas recentes
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Buscar workflow runs dos últimos 7 dias
            const since = new Date();
            since.setDate(since.setDate() - 7);

            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              status: 'failure',
              per_page: 100
            });

            // Agrupar por workflow
            const failingWorkflows = {};
            for (const run of runs.workflow_runs) {
              const workflowName = run.name;
              if (!failingWorkflows[workflowName]) {
                failingWorkflows[workflowName] = {
                  name: workflowName,
                  path: run.path,
                  failures: 0,
                  lastFailure: run.created_at
                };
              }
              failingWorkflows[workflowName].failures++;
            }

            // Filtrar workflows com múltiplas falhas
            const problematicWorkflows = Object.values(failingWorkflows)
              .filter(w => w.failures >= 2)
              .sort((a, b) => b.failures - a.failures);

            console.log('Workflows com falhas detectados:', problematicWorkflows);

            core.setOutput('workflows', JSON.stringify(problematicWorkflows));
            core.setOutput('has_failures', problematicWorkflows.length > 0);

            return problematicWorkflows;

  analyze-and-fix:
    name: Analisar e Corrigir Workflows
    needs: detect-failing-workflows
    if: needs.detect-failing-workflows.outputs.has_failures == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Analisar workflows falhando
        id: analyze
        run: |
          echo "📊 Analisando workflows com falhas..."

          WORKFLOWS='${{ needs.detect-failing-workflows.outputs.failing_workflows }}'
          echo "$WORKFLOWS" | jq -r '.[] | "- \(.name): \(.failures) falhas"'

          # Lista de correções comuns
          cat > workflow-fixes.json << 'EOF'
          {
            "common_issues": [
              {
                "pattern": "uses: actions/checkout@v3",
                "fix": "uses: actions/checkout@v4",
                "reason": "Versão desatualizada"
              },
              {
                "pattern": "uses: actions/setup-node@v3",
                "fix": "uses: actions/setup-node@v4",
                "reason": "Versão desatualizada"
              },
              {
                "pattern": "uses: actions/cache@v3",
                "fix": "uses: actions/cache@v4",
                "reason": "Versão desatualizada"
              },
              {
                "pattern": "uses: actions/upload-artifact@v3",
                "fix": "uses: actions/upload-artifact@v4",
                "reason": "Versão desatualizada"
              },
              {
                "pattern": "node-version: [\"18.x\"]",
                "fix": "node-version: [\"22.x\"]",
                "reason": "Node.js 18 EOL"
              },
              {
                "pattern": "timeout-minutes: 60",
                "fix": "timeout-minutes: 30",
                "reason": "Timeout muito longo"
              }
            ]
          }
          EOF

          echo "fixes_available=true" >> $GITHUB_OUTPUT

      - name: Aplicar correções automáticas
        id: apply_fixes
        run: |
          echo "🔧 Aplicando correções automáticas..."

          CHANGES_MADE=false

          # Iterar sobre workflows
          for workflow in .github/workflows/*.yml; do
            echo "Verificando: $workflow"

            MODIFIED=false

            # Correção 1: Atualizar actions/checkout
            if grep -q "uses: actions/checkout@v3" "$workflow"; then
              sed -i 's/uses: actions\/checkout@v3/uses: actions\/checkout@v4/g' "$workflow"
              echo "  ✅ Atualizado checkout para v4"
              MODIFIED=true
            fi

            # Correção 2: Atualizar actions/setup-node
            if grep -q "uses: actions/setup-node@v3" "$workflow"; then
              sed -i 's/uses: actions\/setup-node@v3/uses: actions\/setup-node@v4/g' "$workflow"
              echo "  ✅ Atualizado setup-node para v4"
              MODIFIED=true
            fi

            # Correção 3: Atualizar actions/cache
            if grep -q "uses: actions/cache@v3" "$workflow"; then
              sed -i 's/uses: actions\/cache@v3/uses: actions\/cache@v4/g' "$workflow"
              echo "  ✅ Atualizado cache para v4"
              MODIFIED=true
            fi

            # Correção 4: Atualizar actions/upload-artifact
            if grep -q "uses: actions/upload-artifact@v3" "$workflow"; then
              sed -i 's/uses: actions\/upload-artifact@v3/uses: actions\/upload-artifact@v4/g' "$workflow"
              echo "  ✅ Atualizado upload-artifact para v4"
              MODIFIED=true
            fi

            # Correção 5: Atualizar Node.js para 22.x
            if grep -q 'node-version: "18.x"' "$workflow"; then
              sed -i 's/node-version: "18.x"/node-version: "22.x"/g' "$workflow"
              echo "  ✅ Atualizado Node.js para 22.x"
              MODIFIED=true
            fi

            # Correção 6: Adicionar continue-on-error para jobs não críticos
            if grep -q "name: SonarCloud\|name: SonarQube\|name: Dashboard de Qualidade" "$workflow" && ! grep -q "continue-on-error: true" "$workflow"; then
              sed -i '/name: SonarCloud\|name: SonarQube\|name: Dashboard de Qualidade/a\    continue-on-error: true' "$workflow"
              echo "  ✅ Adicionado continue-on-error para análise de qualidade"
              MODIFIED=true
            fi

            # Correção 7: Aumentar timeout para builds lentos
            if grep -q "timeout-minutes: 10" "$workflow" && grep -q "build\|compile" "$workflow"; then
              sed -i 's/timeout-minutes: 10/timeout-minutes: 20/g' "$workflow"
              echo "  ✅ Aumentado timeout de build de 10 para 20 minutos"
              MODIFIED=true
            fi

            # Correção 8: Adicionar retry para testes E2E flakey
            if grep -q "playwright\|e2e\|chromium\|firefox" "$workflow" && ! grep -q "retries:" "$workflow"; then
              # Adicionar após a linha de comando do playwright
              sed -i '/playwright test/a\        env:\n          PLAYWRIGHT_RETRIES: 2' "$workflow"
              echo "  ✅ Adicionado retry para testes E2E"
              MODIFIED=true
            fi

            # Correção 9: Corrigir problemas de memória em testes
            if grep -q "vitest\|test:run" "$workflow" && ! grep -q "max-old-space-size" "$workflow"; then
              sed -i 's/npm run test/NODE_OPTIONS="--max-old-space-size=8192" npm run test/g' "$workflow"
              echo "  ✅ Adicionado alocação de memória para testes"
              MODIFIED=true
            fi

            # Correção 10: Adicionar cache de dependências
            if grep -q "npm ci\|npm install" "$workflow" && ! grep -q "actions/cache" "$workflow"; then
              # Procurar linha com npm ci e adicionar cache antes
              line_num=$(grep -n "npm ci\|npm install" "$workflow" | head -1 | cut -d: -f1)
              if [ -n "$line_num" ]; then
                sed -i "${line_num}i\\      - name: Cache dependencies\n        uses: actions/cache@v4\n        with:\n          path: ~/.npm\n          key: \${{ runner.os }}-node-\${{ hashFiles('**/package-lock.json') }}\n          restore-keys: |\n            \${{ runner.os }}-node-\n" "$workflow"
                echo "  ✅ Adicionado cache de dependências"
                MODIFIED=true
              fi
            fi

            # Correção 11: Corrigir deploy Vercel com erro de timeout
            if grep -q "vercel\|deploy" "$workflow"; then
              if grep -q "timeout-minutes: [0-9]" "$workflow"; then
                sed -i 's/timeout-minutes: [0-9]\+/timeout-minutes: 15/g' "$workflow"
                echo "  ✅ Ajustado timeout de deploy Vercel para 15 minutos"
                MODIFIED=true
              fi
            fi

            # Correção 12: Adicionar permissions necessárias
            if ! grep -q "permissions:" "$workflow" && grep -q "pull_request\|push" "$workflow"; then
              sed -i '/^on:/a\npermissions:\n  contents: read\n  pull-requests: write\n  checks: write' "$workflow"
              echo "  ✅ Adicionado permissions necessárias"
          branch: fix/auto-workflows-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            fix
            workflows
            dependabot-like

  report:
    name: Relatório de Correções
    needs: [detect-failing-workflows, analyze-and-fix]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Criar relatório
        run: |
          echo "# 📊 Relatório de Correção de Workflows"
          echo ""
          echo "## Status"
          echo "- Workflows com falhas detectados: ${{ needs.detect-failing-workflows.outputs.has_failures }}"
          echo ""

          if [ "${{ needs.detect-failing-workflows.outputs.has_failures }}" == "true" ]; then
            echo "## Workflows Problemáticos"
            echo '${{ needs.detect-failing-workflows.outputs.failing_workflows }}' | jq -r '.[] | "- \(.name): \(.failures) falhas"'
          else
            echo "✅ Nenhum workflow com falhas recorrentes detectado!"
          fi
