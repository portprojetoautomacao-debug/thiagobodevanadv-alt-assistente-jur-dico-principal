name: Test Self-Hosted Runner

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-runner.yml'

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show system info
      run: |
        echo "🖥️  Sistema Operacional:"
        uname -a
        echo ""
        echo "🐧 Distribuição Linux:"
        cat /etc/os-release | head -2
        echo ""
        echo "💾 Espaço em disco:"
        df -h | head -2
        echo ""
        echo "🧠 Memória RAM:"
        free -h | free -h | head -2

    - name: Test Node.js
      run: |
        echo "📦 Versão do Node.js:"
        node --version
        echo ""
        echo "📦 Versão do npm:"
        npm --version

    - name: Test Git
      run: |
        echo "🔄 Versão do Git:"
        git --version
        echo ""
        echo "📂 Repositório atual:"
        pwd && ls -la

    - name: Success message
      run: |
        echo "✅ Runner auto-hospedado funcionando perfeitamente!"
        echo "🎉 Configuração concluída com sucesso!"
        echo ""
        echo "📊 Status: Runner operacional"
        echo "🏃 Jobs podem ser executados neste ambiente"