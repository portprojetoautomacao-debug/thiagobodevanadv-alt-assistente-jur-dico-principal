name: python-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: streamlit-app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r streamlit-app/requirements.txt

      - name: Run tests
        env:
          USE_REDIS_MOCK: "true"
          PYTHONPATH: "${{ github.workspace }}/streamlit-app"
        run: |
          cd streamlit-app
          pytest -q --maxfail=1
