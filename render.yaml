services:
  # Backend FastAPI
  - type: web
    name: assistente-juridico-backend
    env: python
    region: oregon
    plan: free
    rootDir: streamlit-app
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: GEMINI_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DJEN_USERNAME
        sync: false
      - key: DJEN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://assistente-juridico-streamlit.onrender.com

  # Frontend Streamlit
  - type: web
    name: assistente-juridico-streamlit
    env: python
    region: oregon
    plan: free
    rootDir: streamlit-app
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: GEMINI_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REACT_API_URL
        fromService:
          type: web
          name: assistente-juridico-backend
          property: url
