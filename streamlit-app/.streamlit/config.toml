[server]
port = 8501
address = "0.0.0.0"
headless = true
enableCORS = true
enableXsrfProtection = true
enableWebsocketCompression = true
runOnSave = true
allowRunOnSave = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[client]
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "warning"
messageFormat = "%(asctime)s %(message)s"

[runner]
magicEnabled = true
fastReruns = true

# Security (opcional - para produção)
# [server.security]
# enableXsrfProtection = true
# enableWebsocketCompression = true

# Para deploy público, considere adicionar:
# [browser]
# serverAddress = "seu-dominio.com"
# serverPort = 443
