[pytest]
# Configuração pytest

# Diretórios de teste
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py

# Padrão de funções de teste
python_functions = test_*

# Opções padrão
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personalizados
markers =
    unit: Testes unitários rápidos
    integration: Testes de integração
    slow: Testes que demoram mais tempo
    ml: Testes de modelos ML
    scraper: Testes de scrapers
    automation: Testes de automação

# Cobertura mínima
[coverage:run]
source = lib, backend
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Excluir linhas específicas
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
