# Railway Deployment Configuration
# APENAS para DSPy Bridge (Python FastAPI service)
# NÃO deploiar frontend React (isso é responsabilidade do Vercel)

[build]
builder = "NIXPACKS"

[build.env]
PYTHON_VERSION = "3.11"

[deploy]
startCommand = "python3 scripts/dspy_bridge.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Variáveis de ambiente específicas do DSPy Bridge
# Railway DEVE usar APENAS estas variáveis (não as do frontend)
[deploy.env]
DSPY_PORT = "8765"
NODE_ENV = "production"
DSPY_LM_MODEL = "openai/gpt-3.5-turbo"

# Variáveis sensíveis (configurar no Railway Dashboard):
# - DSPY_API_TOKEN (obrigatório - token de autenticação)
# - ALLOWED_ORIGINS (obrigatório - https://assistente-juridico-github.vercel.app)
# - GEMINI_API_KEY (opcional - se usar Gemini)
# - OPENAI_API_KEY (opcional - se usar OpenAI)

[network]
# Railway auto-assign port
# DSPy bridge usa DSPY_PORT internamente
