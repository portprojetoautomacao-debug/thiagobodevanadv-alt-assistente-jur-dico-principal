    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="google" content="notranslate" />
    <meta name="description"
        content="Sistema inteligente de gestão jurídica com IA, monitoramento DJEN/DataJud, 7 agentes autônomos, calculadora de prazos e CRM de processos" />
    <link rel="canonical" href="https://assistente-juridico-p.vercel.app/" />

    <!-- Preconnect para recursos críticos - melhora LCP e FCP -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <link rel="dns-prefetch" href="https://vercel.live" />

    <!-- CSS crítico inline para evitar render-blocking e melhorar LCP -->
    <style>
        /* Critical CSS - Above the fold styles */
        :root {
            --background: 0 0% 100%;
            --foreground: 240 10% 3.9%;
            --primary: 217.2 91.2% 59.8%
        }

        *,
        ::after,
        ::before {
            box-sizing: border-box;
            border-width: 0;
            border-style: solid
        }

        html {
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif
        }

        body {
            margin: 0;
            line-height: inherit;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground))
        }

        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column
        }

        .min-h-screen {
            min-height: 100vh
        }

        .flex {
            display: flex
        }

        .items-center {
            align-items: center
        }

        .justify-center {
            justify-content: center
        }

        .text-center {
            text-align: center
        }

        .text-3xl {
            font-size: 1.875rem;
            line-height: 2.25rem
        }

        .font-bold {
            font-weight: 700
        }

        .animate-spin {
            animation: spin 1s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .rounded-full {
            border-radius: 9999px
        }

        .h-12 {
            height: 3rem
        }

        .w-12 {
            width: 3rem
        }

        .border-b-2 {
            border-bottom-width: 2px
        }

        .border-primary {
            border-color: hsl(var(--primary))
        }

        .text-sm {
            font-size: .875rem;
            line-height: 1.25rem
        }

        .text-muted-foreground {
            color: hsl(240 3.8% 46.1%)
        }

        .gap-4 {
            gap: 1rem
        }

        .flex-col {
            flex-direction: column
        }

        .p-4 {
            padding: 1rem
        }

        .space-y-6>:not([hidden])~:not([hidden]) {
            margin-top: 1.5rem
        }

        .max-w-md {
            max-width: 28rem
        }

        .w-full {
            width: 100%
        }

        .mb-2 {
            margin-bottom: .5rem
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --background: 240 10% 3.9%;
                --foreground: 0 0% 98%
            }
        }
    </style>
