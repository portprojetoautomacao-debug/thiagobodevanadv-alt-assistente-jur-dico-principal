    <!-- ✅ OTIMIZAÇÃO LCP: CSS crítico inline expandido para evitar render-blocking -->
    <style>
        /* Critical CSS - Above the fold styles */
        :root {
            --background: 0 0% 100%;
            --foreground: 240 10% 3.9%;
            --primary: 217.2 91.2% 59.8%;
            --muted-foreground: 240 3.8% 46.1%;
            --card: 0 0% 100%;
            --border: 240 5.9% 90%
        }

        *,
        ::after,
        ::before {
            box-sizing: border-box;
            border-width: 0;
            border-style: solid;
        }

        html {
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            line-height: inherit;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }

        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Loading Spinner */
        .loading-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            padding: 1rem;
        }

        .loading-spinner {
            width: 3rem;
            height: 3rem;
            border-radius: 9999px;
            border: 2px solid transparent;
            border-bottom-color: hsl(var(--primary));
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 0.875rem;
            color: hsl(var(--muted-foreground));
        }

        .loading-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: hsl(var(--foreground));
            margin-bottom: 0.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Utility classes */
        .min-h-screen {
            min-height: 100vh;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .justify-center {
            justify-content: center;
        }

        .text-center {
            text-align: center;
        }

        .text-3xl {
            font-size: 1.875rem;
            line-height: 2.25rem;
        }

        .font-bold {
            font-weight: 700;
        }

        .rounded-full {
            border-radius: 9999px;
        }

        .h-12 {
            height: 3rem;
        }

        .w-12 {
            width: 3rem;
        }

        /* Background & Card */
        .bg-background {
            background-color: hsl(var(--background));
        }

        .bg-card {
            background-color: hsl(var(--card));
        }

        .border {
            border-width: 1px;
            border-color: hsl(var(--border));
        }

        .rounded-lg {
            border-radius: 0.5rem;
        }

        .shadow-sm {
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --background: 240 10% 3.9%;
                --foreground: 0 0% 98%;
                --muted-foreground: 240 5% 64.9%;
                --card: 240 10% 3.9%;
                --border: 240 3.7% 15.9%;
            }
        }
    </style>
