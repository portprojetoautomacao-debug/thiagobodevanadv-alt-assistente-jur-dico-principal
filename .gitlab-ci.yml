# CI/CD Pipeline para Assistente Jurídico PJe
# Pipeline completo usando componentes reutilizáveis GitLab CI/CD
# Otimizado para aplicações React/TypeScript com foco jurídico

stages:
  - security
  - test
  - build
  - deploy
  - monitor

# Configurações globais
variables:
  NODE_VERSION: "22"
  NODE_ENV: "production"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  GIT_DEPTH: 10
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: none
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.npm"

# Cache global para dependências Node.js
cache:
  key: "npm-cache-v2-${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm/
    - node_modules/

# Componentes CI/CD reutilizáveis
include:
  # Componente de Segurança - Auditoria completa com compliance LGPD
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/templates/security/security-component@1.0.0
    inputs:
      stage: security
      audit_level: "standard"
      fail_on_high: true
      report_format: "json"

  # Componente de Testes - Suite completa para React/TypeScript
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/templates/testing/testing-component@1.0.0
    inputs:
      stage: test
      test_type: "all"
      coverage_threshold: 80
      fail_on_coverage: false
      browser: "chromium"

  # Componente de Deployment - Multi-plataforma com health checks
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/templates/deployment/deployment-component@1.0.0
    inputs:
      stage: deploy
      environment: "staging"
      deploy_target: "vercel"
      health_check_url: "https://assistente-juridico-p.vercel.app"
      rollback_on_failure: true
      monitoring_enabled: true

  # Componente de Monitoramento - Performance e disponibilidade
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/templates/monitoring/monitoring-component@1.0.0
    inputs:
      stage: monitor
      monitoring_type: "advanced"
      alert_on_failure: true
      performance_baseline: 3000
      accessibility_threshold: 90

# Job adicional: Build da aplicação
build:
  stage: build
  image: node:${NODE_VERSION}
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🏗️ Construindo aplicação React/TypeScript..."
    - npm run build
    - echo "📦 Build concluído com sucesso!"
    - echo "📊 Tamanho do bundle:"
    - du -sh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - merge_requests
    - main
    - develop
  dependencies: []

# Job adicional: Lint e formatação
lint:
  stage: test
  image: node:${NODE_VERSION}
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🔍 Executando linting e verificações de código..."
    - npm run lint
    - echo "✅ Linting concluído sem erros!"
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    expire_in: 1 week
    when: always
  only:
    - merge_requests
    - main
    - develop
  allow_failure: false

# Job adicional: Verificações de segurança adicionais
security-scan:
  stage: security
  image: node:${NODE_VERSION}
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🔐 Executando verificações de segurança adicionais..."
    - |
      # Verificar se há arquivos sensíveis no repositório
      if find . -name "*.env*" -o -name "*secret*" -o -name "*key*" | grep -v node_modules | grep -v .git; then
        echo "⚠️ Possíveis arquivos sensíveis encontrados!"
        exit 1
      else
        echo "✅ Nenhum arquivo sensível detectado"
      fi
    - |
      # Verificar configurações de segurança no código
      if grep -r "console.log\|debugger" src/ --include="*.ts" --include="*.tsx" | grep -v node_modules; then
        echo "⚠️ Código de debug encontrado em produção!"
        exit 1
      else
        echo "✅ Nenhum código de debug encontrado"
      fi
  only:
    - merge_requests
    - main
    - develop
  allow_failure: false

# Job adicional: Testes de carga básicos
load-test:
  stage: test
  image: node:${NODE_VERSION}
  script:
    - echo "⚡ Executando testes de carga básicos..."
    - |
      # Simulação básica de carga
      for i in {1..10}; do
        curl -s -o /dev/null -w "Request $i: %{time_total}s\n" http://localhost:5173 &
      done
      wait
      echo "✅ Testes de carga concluídos"
  services:
    - name: nginx:alpine
      command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
  only:
    - main
    - develop
  allow_failure: true

# Job adicional: Deploy para produção (manual)
deploy-production:
  stage: deploy
  image: node:${NODE_VERSION}
  environment:
    name: production
    url: https://assistente-juridico-p.vercel.app
  script:
    - echo "🚀 Fazendo deploy para produção..."
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - |
      # Deploy para Vercel produção
      npx vercel --prod --yes
      echo "✅ Deploy para produção concluído!"
  dependencies:
    - build
  only:
    - main
  when: manual
  allow_failure: false

# Job adicional: Backup de dados (semanal)
backup:
  stage: monitor
  image: node:${NODE_VERSION}
  script:
    - echo "💾 Executando backup de dados..."
    - |
      # Simulação de backup (integrar com Upstash, etc.)
      echo "📦 Backup concluído em $(date)" > backup-log.txt
      echo "✅ Backup executado com sucesso"
  artifacts:
    paths:
      - backup-log.txt
    expire_in: 1 week
  only:
    - schedules
  allow_failure: true

# Job adicional: Relatório consolidado do pipeline
pipeline-report:
  stage: monitor
  image: node:${NODE_VERSION}
  script:
    - echo "📊 Gerando relatório consolidado do pipeline..."
    - |
      echo "# Relatório de Pipeline - Assistente Jurídico PJe" > pipeline-report.md
      echo "" >> pipeline-report.md
      echo "## 📋 Informações Gerais" >> pipeline-report.md
      echo "- **Pipeline ID**: $CI_PIPELINE_ID" >> pipeline-report.md
      echo "- **Commit**: $CI_COMMIT_SHA" >> pipeline-report.md
      echo "- **Branch**: $CI_COMMIT_REF_NAME" >> pipeline-report.md
      echo "- **Data**: $(date)" >> pipeline-report.md
      echo "" >> pipeline-report.md
      echo "## ✅ Status dos Stages" >> pipeline-report.md
      echo "- **Security**: Executado" >> pipeline-report.md
      echo "- **Test**: Executado" >> pipeline-report.md
      echo "- **Build**: Executado" >> pipeline-report.md
      echo "- **Deploy**: Executado" >> pipeline-report.md
      echo "- **Monitor**: Executado" >> pipeline-report.md
      echo "" >> pipeline-report.md
      echo "## 🔗 Links Importantes" >> pipeline-report.md
      echo "- [Pipeline no GitLab]($CI_PIPELINE_URL)" >> pipeline-report.md
      echo "- [Commit]($CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA)" >> pipeline-report.md
      echo "- [MR]($CI_MERGE_REQUEST_TARGET_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID)" >> pipeline-report.md
    - cat pipeline-report.md
  artifacts:
    paths:
      - pipeline-report.md
    expire_in: 1 week
  when: always
  dependencies: []

# Configurações específicas para diferentes branches
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        DEPLOY_ENV: "production"
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        DEPLOY_ENV: "staging"
    - if: $CI_MERGE_REQUEST_ID
      variables:
        DEPLOY_ENV: "preview"
    - when: always
