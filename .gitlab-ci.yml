# =============================================================================
# CI/CD Pipeline para Assistente Jurídico PJe
# =============================================================================
# Pipeline otimizado para aplicações React/TypeScript com foco jurídico
# Compatível com GitLab CI/CD sem necessidade de CI/CD Catalog
# =============================================================================

stages:
  - security
  - test
  - build
  - deploy
  - monitor

# =============================================================================
# CONFIGURAÇÕES GLOBAIS
# =============================================================================
variables:
  NODE_VERSION: "22"
  NODE_ENV: "production"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  GIT_DEPTH: 10
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: none
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.npm"
  PRODUCTION_URL: "https://assistente-juridico-p.vercel.app"
  STAGING_URL: "https://assistente-juridico-p-staging.vercel.app"

# Cache global para dependências Node.js
cache:
  key: "npm-cache-v3-${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm/
    - node_modules/
  policy: pull-push

# Template base para jobs Node.js
.node-base:
  image: node:${NODE_VERSION}
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit

# =============================================================================
# STAGE: SECURITY
# =============================================================================

security-audit:
  extends: .node-base
  stage: security
  script:
    - echo "🔒 Executando auditoria de segurança..."
    - npm audit --audit-level=high --production --json > security-audit.json || true
    - |
      CRITICAL=$(npm audit --audit-level=critical --production 2>/dev/null | grep -c "vulnerability" || echo "0")
      if [ "$CRITICAL" -gt "0" ]; then
        echo "🚨 Vulnerabilidades críticas encontradas!"
        exit 1
      fi
    - echo "✅ Auditoria de segurança passou"
  artifacts:
    paths:
      - security-audit.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: false

secret-detection:
  stage: security
  image: alpine:latest
  script:
    - echo "🔍 Verificando vazamento de segredos..."
    - apk add --no-cache grep
    - |
      PATTERNS="(api[_-]?key|secret|password|token|credential).*[=:].*['\"][^'\"]{20,}"
      if grep -rEi "$PATTERNS" --include="*.ts" --include="*.tsx" src/ api/ 2>/dev/null | \
         grep -v "process\.env" | grep -v "import\.meta\.env" | grep -v "VITE_" | \
         grep -v "test" | grep -v "mock" | grep -v "example"; then
        echo "🚨 Possível vazamento de segredos!"
        exit 1
      fi
    - echo "✅ Nenhum segredo exposto"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

lgpd-check:
  extends: .node-base
  stage: security
  script:
    - echo "⚖️ Verificando compliance LGPD..."
    - grep -rn "CPF\|CNPJ\|RG\|email\|telefone" src/ --include="*.ts" --include="*.tsx" > lgpd-usage.txt 2>/dev/null || true
    - |
      if [ -s lgpd-usage.txt ]; then
        echo "⚠️ Uso de dados pessoais detectado:"
        head -20 lgpd-usage.txt
      else
        echo "ℹ️ Nenhum uso óbvio de dados pessoais"
      fi
  artifacts:
    paths:
      - lgpd-usage.txt
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# =============================================================================
# STAGE: TEST
# =============================================================================

lint:
  extends: .node-base
  stage: test
  script:
    - echo "🔍 Executando ESLint..."
    - npm run lint
    - echo "🔍 Verificando tipos TypeScript..."
    - npx tsc --noEmit --skipLibCheck
    - echo "✅ Linting e type check passaram"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: false

unit-tests:
  extends: .node-base
  stage: test
  script:
    - echo "🧪 Executando testes unitários..."
    - npm run test -- --run --coverage
    - echo "✅ Testes unitários concluídos"
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

e2e-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-jammy
  script:
    - npm ci --cache .npm --prefer-offline --no-audit
    - npx playwright install chromium
    - npm run build
    - echo "🎭 Executando testes E2E..."
    - npm run test:e2e || echo "⚠️ Alguns testes E2E falharam"
  artifacts:
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# =============================================================================
# STAGE: BUILD
# =============================================================================

build:
  extends: .node-base
  stage: build
  script:
    - echo "🏗️ Construindo aplicação React/TypeScript..."
    - npm run build
    - echo "📦 Build concluído!"
    - du -sh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# =============================================================================
# STAGE: DEPLOY
# =============================================================================

deploy-staging:
  extends: .node-base
  stage: deploy
  environment:
    name: staging
    url: $STAGING_URL
  script:
    - echo "🚀 Deploy para staging..."
    - npm install -g vercel@latest
    - vercel deploy --yes --token=$VERCEL_TOKEN
    - echo "✅ Deploy staging concluído!"
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: false

deploy-production:
  extends: .node-base
  stage: deploy
  environment:
    name: production
    url: $PRODUCTION_URL
  script:
    - echo "🚀 Deploy para produção..."
    - npm install -g vercel@latest
    - vercel deploy --prod --yes --token=$VERCEL_TOKEN
    - echo "✅ Deploy produção concluído!"
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false

deploy-review:
  extends: .node-base
  stage: deploy
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG.vercel.app
    on_stop: stop-review
    auto_stop_in: 1 week
  script:
    - echo "🔍 Deploy Review App para $CI_COMMIT_REF_NAME"
    - npm install -g vercel@latest
    - vercel deploy --yes --token=$VERCEL_TOKEN
    - echo "✅ Review App criado!"
  dependencies:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true

stop-review:
  stage: deploy
  image: node:${NODE_VERSION}
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  script:
    - echo "🛑 Parando Review App"
    - npm install -g vercel@latest
    - vercel rm $CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG --yes --token=$VERCEL_TOKEN || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  allow_failure: true
  dependencies: []

# =============================================================================
# STAGE: MONITOR
# =============================================================================

health-check:
  stage: monitor
  image: curlimages/curl:latest
  script:
    - echo "🏥 Health check..."
    - |
      URL="${PRODUCTION_URL}/api/status"
      for i in 1 2 3 4 5; do
        if curl -sf --max-time 30 "$URL" > /dev/null; then
          echo "✅ Health check passou!"
          exit 0
        fi
        sleep 10
      done
      echo "❌ Health check falhou"
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

performance-audit:
  extends: .node-base
  stage: monitor
  script:
    - echo "📊 Auditoria de performance..."
    - npm install -g lighthouse
    - |
      lighthouse $PRODUCTION_URL \
        --output=json \
        --output-path=lighthouse-report.json \
        --chrome-flags="--headless --no-sandbox" \
        --only-categories=performance,accessibility,seo \
        || echo "⚠️ Lighthouse falhou"
  artifacts:
    paths:
      - lighthouse-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

pipeline-report:
  stage: monitor
  image: alpine:latest
  script:
    - echo "📊 Relatório do pipeline..."
    - |
      cat > pipeline-report.md << EOF
      # Relatório - Assistente Jurídico PJe
      - Pipeline: $CI_PIPELINE_ID
      - Commit: $CI_COMMIT_SHA
      - Branch: $CI_COMMIT_REF_NAME
      - Data: $(date)
      EOF
    - cat pipeline-report.md
  artifacts:
    paths:
      - pipeline-report.md
    expire_in: 1 week
  when: always
  dependencies: []

# =============================================================================
# WORKFLOW RULES
# =============================================================================
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        DEPLOY_ENV: "production"
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        DEPLOY_ENV: "staging"
    - if: $CI_MERGE_REQUEST_ID
      variables:
        DEPLOY_ENV: "preview"
    - when: always
