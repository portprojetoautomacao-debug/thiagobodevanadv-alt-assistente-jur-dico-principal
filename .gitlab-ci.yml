include:
  - template: Auto-DevOps.gitlab-ci.yml

# GitLab CI/CD Pipeline - Kubernetes Ready
# Pipeline completo com Docker, Coverage e Deploy

stages:
  - build
  - test
  - deploy
  - review
  - docker
  - dast
  - staging
  - canary
  - production
  - incremental rollout 10%
  - incremental rollout 25%
  - incremental rollout 50%
  - incremental rollout 100%
  - performance
  - cleanup
  - post

variables:
  NODE_ENV: "production"
  KUBE_INGRESS_BASE_DOMAIN: "$KUBE_INGRESS_BASE_DOMAIN"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  LATEST_TAG: $CI_REGISTRY_IMAGE:latest
  GITLAB_TOKEN: "${GITLAB_TOKEN}"
  GITLAB_DUO_ACCESS_TOKEN: "${GITLAB_DUO_ACCESS_TOKEN}"
  AUTO_DEVOPS_PLATFORM_TARGET: "kubernetes"
  AUTO_DEVOPS_DEPLOY_STRATEGY: "continuous"
  BUILD_DISABLED: "true"
  TEST_DISABLED: "true"
  REVIEW_DISABLED: "true"
  BROWSER_PERFORMANCE_DISABLED: "true"
  LOAD_PERFORMANCE_DISABLED: "true"
  CODE_INTELLIGENCE_DISABLED: "true"
  DAST_DISABLED: "true"
  CONTAINER_SCANNING_DISABLED: "true"
  # GitLab Kubernetes Agents (primary e secondary)
  KUBE_CONTEXT_PRIMARY: "thiagobodevan-a11y/assistente-juridico-p:agenterevisor"
  KUBE_CONTEXT_SECONDARY: "thiagobodevan-a11y/assistente-juridico-p:agenterevisor2"
  KUBE_CONTEXT: "thiagobodevan-a11y/assistente-juridico-p:agenterevisor2"

# Cache global para acelerar builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# Build da aplicação
build_app:
  stage: build
  image: node:22-alpine
  script:
    - npm ci --prefer-offline --no-audit
    - npm run build 2>&1 || { echo "Build failed"; exit 1; }
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main
    - merge_requests
  retry:
    max: 2
    when: runner_system_failure

# Testes com Coverage
test_app:
  stage: test
  image: node:22-alpine
  script:
    - npm ci --prefer-offline --no-audit
    - npm run test -- --run --reporter=verbose --coverage || echo "Tests not configured yet"
    - npm run lint || echo "Linting with warnings"
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 30 days
  allow_failure: true
  only:
    - main
    - merge_requests
  retry:
    max: 2
    when: runner_system_failure

# Security scan
security_scan:
  stage: test
  image: node:22-alpine
  script:
    - npm ci --prefer-offline --no-audit
    - npm audit --audit-level=moderate || echo "Vulnerabilities found (non-blocking)"
  allow_failure: true
  only:
    - main
    - merge_requests
  retry:
    max: 2
    when: runner_system_failure

# GitLab Duo Auto Review
duo_auto_review:
  stage: review
  image: node:22-alpine
  needs:
    - build_app
    - test_app
  script:
    - npm ci --prefer-offline --no-audit
    - |
      if [ -z "$CI_MERGE_REQUEST_IID" ]; then
        echo "No merge request IID available; skipping GitLab Duo review."
        exit 0
      fi
    - npx @gitlab/duo-cli@latest run \
        --gitlab-auth-token "$GITLAB_DUO_ACCESS_TOKEN" \
        --gitlab-project-path "$CI_PROJECT_PATH" \
        --gitlab-base-url "$CI_SERVER_URL" \
        --goal "Review merge request !${CI_MERGE_REQUEST_IID}"
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_DUO_ACCESS_TOKEN'
      when: on_success
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//' 
      when: manual
    - when: never

# Build Docker Image
docker_build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG -t $LATEST_TAG .
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG
  needs:
    - build_app
    - test_app
  only:
    - main
    - tags
  when: manual
  retry:
    max: 2
    when: runner_system_failure

# Deploy Staging com Kubernetes
deploy_staging:
  stage: staging
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to staging environment"
    - echo "Image $IMAGE_TAG"
    - echo "Using GitLab Kubernetes Agent $KUBE_CONTEXT"
    - kubectl config get-contexts
    - kubectl config use-context $KUBE_CONTEXT || echo "Context not available - using default"
    - kubectl get nodes
    - kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
    - kubectl set image deployment/assistente-juridico assistente-juridico=$IMAGE_TAG -n staging || echo "Deployment not found - will be created"
    - kubectl rollout status deployment/assistente-juridico -n staging --timeout=5m || echo "Rollout status check skipped"
  environment:
    name: staging
    url: https://staging.$KUBE_INGRESS_BASE_DOMAIN
    kubernetes:
      namespace: staging
  needs:
    - build_app
    - docker_build
  only:
    - main
  when: manual

# Deploy Production com Kubernetes
deploy_production:
  stage: production
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to production environment"
    - echo "Tag $CI_COMMIT_TAG"
    - echo "Using GitLab Kubernetes Agent $KUBE_CONTEXT"
    - kubectl config get-contexts
    - kubectl config use-context $KUBE_CONTEXT || echo "Context not available - using default"
    - kubectl get nodes
    - kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
    - kubectl set image deployment/assistente-juridico assistente-juridico=$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG -n production || echo "Deployment not found - will be created"
    - kubectl rollout status deployment/assistente-juridico -n production --timeout=5m || echo "Rollout status check skipped"
  environment:
    name: production
    url: https://$KUBE_INGRESS_BASE_DOMAIN
    kubernetes:
      namespace: production
  needs:
    - build_app
    - docker_build
  only:
    - tags
  when: manual

# Disable default Auto DevOps production promotion in favor of custom job above.
production:
  rules:
    - when: never

production_manual:
  rules:
    - when: never

# Notificações
.post:success:
  stage: post
  image: alpine:latest
  script:
    - echo "Pipeline succeeded!"
    - echo "Pipeline $CI_PIPELINE_URL"

.post:failure:
  stage: post
  image: alpine:latest
  script:
    - echo "Pipeline failed!"
    - echo "Check $CI_PIPELINE_URL"
