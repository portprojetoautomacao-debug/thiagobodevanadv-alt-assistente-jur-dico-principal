image: node:22

variables:
  NODE_ENV: "production"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  GIT_DEPTH: 10
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: none

cache:
  key: "npm-cache-v2-${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
  policy: pull-push
    - .npm/

stages:
  - install
  - test
  - security
  - build
  - deploy

install_deps:
  stage: install
  script:
    - echo "🧹 Limpando cache npm..."
    - npm cache clean --force
    - echo "📦 Instalando dependências..."
    - npm ci --prefer-offline --no-audit --include=dev --force
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  only:
    - main

lint:
  stage: test
  dependencies:
    - install_deps
  script:
    - echo "🔍 Verificando se ESLint está instalado..."
    - npx eslint --version
    - echo "🧹 Executando lint..."
    - npm run lint
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  only:
    - main

unit_tests:
  stage: test
  dependencies:
    - install_deps
  script:
    - echo "🧪 Verificando se Vitest está instalado..."
    - npx vitest --version
    - echo "🧪 Executando testes unitários..."
    - npm test -- --run --coverage --reporter=verbose
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days
  allow_failure: true
  only:
    - main

security_scan:
  stage: security
  dependencies:
    - install_deps
  script:
    - npm audit --production --audit-level=moderate
  allow_failure: true
  only:
    - main

dependency_check:
  stage: security
  dependencies:
    - install_deps
  script:
    - npx license-checker --summary
  allow_failure: true
  only:
    - main

build:
  stage: build
  dependencies:
    - install_deps
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  only:
    - main

deploy_production:
  stage: deploy
  dependencies:
    - build
  script:
    - echo "✅ Build artifacts ready in dist/"
    - echo "📦 Total files:" && ls -1 dist/ | wc -l
    - echo "💾 Build size:" && du -sh dist/
  environment:
    name: production
    url: https://assistente-juridico-p.vercel.app
  only:
    - main
  when: on_success
