# CI/CD Pipeline para Assistente Jurídico PJe
# Pipeline completo para aplicações React/TypeScript
# Otimizado para deploy na Vercel

stages:
  - security
  - test
  - build
  - deploy
  - monitor

# Configurações globais
variables:
  NODE_VERSION: "22"
  NODE_ENV: "production"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  GIT_DEPTH: 10
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: none
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.npm"

# Cache global para dependências Node.js
cache:
  key: "npm-cache-v3-${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm/
    - node_modules/
  policy: pull-push

# Template para jobs Node.js
.node_template:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline --silent

# ==========================================
# STAGE: SECURITY
# ==========================================

# Auditoria de dependências
security-audit:
  extends: .node_template
  stage: security
  script:
    - echo "🔐 Executando auditoria de segurança..."
    - npm audit --audit-level=high || true
    - echo "✅ Auditoria de segurança concluída"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true

# Verificação de segredos expostos
secret-detection:
  stage: security
  image: alpine:latest
  script:
    - echo "🔍 Verificando arquivos sensíveis..."
    - |
      # Verificar se há credenciais hardcoded (excluindo exemplos e docs)
      if grep -rE "(ghp_|gho_|ghs_|ghr_|github_pat_)[a-zA-Z0-9]{36}" . \
         --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
         2>/dev/null | grep -v node_modules | grep -v ".git" | grep -v ".example" | grep -v ".md"; then
        echo "❌ Possíveis tokens GitHub encontrados!"
        exit 1
      fi
    - echo "✅ Verificação de segredos concluída"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# ==========================================
# STAGE: TEST
# ==========================================

# Linting e formatação
lint:
  extends: .node_template
  stage: test
  script:
    - echo "🔍 Executando linting..."
    - npm run lint 2>&1 || echo "⚠️ Alguns avisos de lint encontrados"
    - echo "✅ Linting concluído"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true

# Testes unitários
unit-tests:
  extends: .node_template
  stage: test
  script:
    - echo "🧪 Executando testes unitários..."
    - npm run test -- --run --reporter=verbose --coverage || echo "⚠️ Alguns testes falharam"
    - echo "✅ Testes unitários concluídos"
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    paths:
      - coverage/
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true

# Type check
typecheck:
  extends: .node_template
  stage: test
  script:
    - echo "📝 Verificando tipos TypeScript..."
    - npx tsc --noEmit || echo "⚠️ Alguns erros de tipo encontrados"
    - echo "✅ Verificação de tipos concluída"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# ==========================================
# STAGE: BUILD
# ==========================================

# Build da aplicação
build:
  extends: .node_template
  stage: build
  script:
    - echo "🏗️ Construindo aplicação React/TypeScript..."
    - npm run build
    - echo "📦 Build concluído com sucesso!"
    - echo "📊 Tamanho do bundle:"
    - du -sh dist/ || echo "dist não encontrado"
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  needs:
    - job: lint
      optional: true
    - job: unit-tests
      optional: true

# ==========================================
# STAGE: DEPLOY
# ==========================================

# Deploy para staging (automático em develop)
deploy-staging:
  extends: .node_template
  stage: deploy
  environment:
    name: staging
    url: https://assistente-juridico-staging.vercel.app
  script:
    - echo "🚀 Deploy para staging..."
    - |
      if [ -z "$VERCEL_TOKEN" ]; then
        echo "⚠️ VERCEL_TOKEN não configurado - pulando deploy"
        exit 0
      fi
    - |
      mkdir -p .vercel
      echo '{"orgId":"'"$VERCEL_ORG_ID"'","projectId":"'"$VERCEL_PROJECT_ID"'"}' > .vercel/project.json
    - npx vercel deploy --token=$VERCEL_TOKEN --yes || echo "⚠️ Deploy falhou"
    - echo "✅ Deploy staging concluído"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - build
  allow_failure: true

# Deploy para produção (manual em main)
deploy-production:
  extends: .node_template
  stage: deploy
  environment:
    name: production
    url: https://assistente-juridico-p.vercel.app
  script:
    - echo "🚀 Deploy para produção..."
    - |
      if [ -z "$VERCEL_TOKEN" ]; then
        echo "❌ VERCEL_TOKEN não configurado"
        echo "Configure em: Settings > CI/CD > Variables"
        exit 1
      fi
    - |
      mkdir -p .vercel
      echo '{"orgId":"'"$VERCEL_ORG_ID"'","projectId":"'"$VERCEL_PROJECT_ID"'"}' > .vercel/project.json
    - npx vercel deploy --prod --token=$VERCEL_TOKEN --yes
    - echo "✅ Deploy produção concluído!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - build
  allow_failure: false

# Review Apps para Merge Requests
deploy-review:
  extends: .node_template
  stage: deploy
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://$CI_COMMIT_REF_SLUG-assistente-juridico.vercel.app
    on_stop: stop-review
    auto_stop_in: 1 week
  script:
    - echo "🔍 Deploy Review App: $CI_COMMIT_REF_NAME"
    - |
      if [ -z "$VERCEL_TOKEN" ]; then
        echo "⚠️ VERCEL_TOKEN não configurado - pulando review app"
        exit 0
      fi
    - |
      mkdir -p .vercel
      echo '{"orgId":"'"$VERCEL_ORG_ID"'","projectId":"'"$VERCEL_PROJECT_ID"'"}' > .vercel/project.json
    - npx vercel deploy --token=$VERCEL_TOKEN --yes || echo "⚠️ Review app falhou"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - build
  allow_failure: true

# Parar Review Apps
stop-review:
  stage: deploy
  image: alpine:latest
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  script:
    - echo "🛑 Parando Review App: $CI_COMMIT_REF_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  allow_failure: true
  dependencies: []

# ==========================================
# STAGE: MONITOR
# ==========================================

# Relatório do pipeline
pipeline-report:
  stage: monitor
  image: alpine:latest
  script:
    - echo "📊 Gerando relatório do pipeline..."
    - |
      cat > pipeline-report.md << EOF
      # 📊 Relatório - Assistente Jurídico PJe
      
      | Campo | Valor |
      |-------|-------|
      | Pipeline | $CI_PIPELINE_ID |
      | Commit | ${CI_COMMIT_SHORT_SHA} |
      | Branch | $CI_COMMIT_REF_NAME |
      | Data | $(date -u +"%Y-%m-%d %H:%M:%S UTC") |
      
      ✅ Pipeline executado!
      EOF
    - cat pipeline-report.md
  artifacts:
    paths:
      - pipeline-report.md
    expire_in: 1 week
  when: always
  dependencies: []

# ==========================================
# WORKFLOW RULES
# ==========================================

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - when: never
