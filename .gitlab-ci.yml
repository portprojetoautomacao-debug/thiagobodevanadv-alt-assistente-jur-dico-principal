# CI/CD Pipeline para Assistente Juridico PJe

stages:
  - security
  - test
  - build
  - deploy
  - monitor

variables:
  NODE_VERSION: "22"
  NODE_ENV: "production"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  GIT_DEPTH: 10

cache:
  key: "npm-cache-v3-${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm/
    - node_modules/
  policy: pull-push

.node_template:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci --cache .npm --prefer-offline --silent

# STAGE: SECURITY

security-audit:
  extends: .node_template
  stage: security
  script:
    - echo "Executando auditoria de seguranca..."
    - npm audit --audit-level=high || true
    - echo "Auditoria de seguranca concluida"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true

# STAGE: TEST

lint:
  extends: .node_template
  stage: test
  script:
    - echo "Executando linting..."
    - npm run lint || echo "Alguns avisos de lint encontrados"
    - echo "Linting concluido"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true

unit-tests:
  extends: .node_template
  stage: test
  script:
    - echo "Executando testes unitarios..."
    - npm run test -- --run --reporter=verbose --coverage || echo "Alguns testes falharam"
    - echo "Testes unitarios concluidos"
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    paths:
      - coverage/
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true

typecheck:
  extends: .node_template
  stage: test
  script:
    - echo "Verificando tipos TypeScript..."
    - npx tsc --noEmit || echo "Alguns erros de tipo encontrados"
    - echo "Verificacao de tipos concluida"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# STAGE: BUILD

build:
  extends: .node_template
  stage: build
  script:
    - echo "Construindo aplicacao React/TypeScript..."
    - npm run build
    - echo "Build concluido com sucesso!"
    - du -sh dist/ || echo "dist nao encontrado"
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  needs:
    - job: lint
      optional: true
    - job: unit-tests
      optional: true

# STAGE: DEPLOY

deploy-staging:
  extends: .node_template
  stage: deploy
  environment:
    name: staging
    url: https://assistente-juridico-staging.vercel.app
  script:
    - echo "Deploy para staging..."
    - if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN nao configurado"; exit 0; fi
    - mkdir -p .vercel
    - echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
    - npx vercel deploy --token=$VERCEL_TOKEN --yes || echo "Deploy falhou"
    - echo "Deploy staging concluido"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - build
  allow_failure: true

deploy-production:
  extends: .node_template
  stage: deploy
  environment:
    name: production
    url: https://assistente-juridico-p.vercel.app
  script:
    - echo "Deploy para producao..."
    - if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN nao configurado"; exit 1; fi
    - mkdir -p .vercel
    - echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
    - npx vercel deploy --prod --token=$VERCEL_TOKEN --yes
    - echo "Deploy producao concluido!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - build
  allow_failure: false

deploy-review:
  extends: .node_template
  stage: deploy
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://$CI_COMMIT_REF_SLUG-assistente-juridico.vercel.app
    on_stop: stop-review
    auto_stop_in: 1 week
  script:
    - echo "Deploy Review App"
    - if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN nao configurado"; exit 0; fi
    - mkdir -p .vercel
    - echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
    - npx vercel deploy --token=$VERCEL_TOKEN --yes || echo "Review app falhou"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - build
  allow_failure: true

stop-review:
  stage: deploy
  image: alpine:latest
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  script:
    - echo "Parando Review App"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  allow_failure: true
  dependencies: []

# STAGE: MONITOR

pipeline-report:
  stage: monitor
  image: alpine:latest
  script:
    - echo "Gerando relatorio do pipeline..."
    - echo "Pipeline ID - $CI_PIPELINE_ID" > pipeline-report.md
    - echo "Commit - $CI_COMMIT_SHORT_SHA" >> pipeline-report.md
    - echo "Branch - $CI_COMMIT_REF_NAME" >> pipeline-report.md
    - cat pipeline-report.md
  artifacts:
    paths:
      - pipeline-report.md
    expire_in: 1 week
  when: always
  dependencies: []

# WORKFLOW RULES

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - when: never
