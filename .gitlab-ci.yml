# GitLab CI/CD Pipeline com GitLab Duo e CI/CD Inputs
# TESTE: MR de teste para validar as configurações avançadas do GitLab Duo

# Configuração usando CI/CD Inputs - Ambiente de Desenvolvimento
include:
  - local: '.gitlab/duo-inputs-config.yml'
    inputs:
      duo_enabled: true
      auto_review: true
      security_level: "standard"
      max_comments: 25
      audit_logging: true
      legal_compliance_checks: ["lgpd_compliance", "legal_documentation"]
      custom_agents: ["assistente-juridico-reviewer", "assistente-juridico-generator"]

image: node:22

variables:
  NODE_ENV: "production"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  GIT_DEPTH: 10
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: none

cache:
  key: "npm-cache-v2-${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
    - .npm/

stages:

# Job de teste do GitLab Duo
duo_test:
  stage: test
  script:
    - echo "🤖 Testando GitLab Duo com CI/CD Inputs..."
    - echo "Security Level: $[[ inputs.security_level ]]"
    - echo "Legal Checks: $[[ inputs.legal_compliance_checks ]]"
    - echo "Custom Agents: $[[ inputs.custom_agents ]]"
    - echo "Audit Logging: $[[ inputs.audit_logging ]]"
    - ./scripts/validate-gitlab-duo-advanced.sh
  only:
    - merge_requests
  - install
  - test
  - security
  - build
  - deploy

install_deps:
  stage: install
  script:
    - echo "🧹 Limpando cache npm..."
    - npm cache clean --force
    - echo "📦 Instalando dependências..."
    - npm ci --prefer-offline --no-audit --include=dev --force
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  only:
    - main

lint:
  stage: test
  dependencies:
    - install_deps
  script:
    - echo "🔍 Verificando se ESLint está instalado..."
    - npx eslint --version
    - echo "🧹 Executando lint..."
    - npm run lint
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  only:
    - main

unit_tests:
  stage: test
  image: node:22
  cache:
    key: npm-cache-v2-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  before_script:
    - echo "🧪 Verificando se Vitest está instalado..."
    - npx vitest --version
  script:
    - echo "🧪 Executando testes de componentes..."
    - npm test -- --run --coverage --reporter=verbose
    - echo "🧪 Executando testes de API..."
    - npm run test:api -- --run --reporter=verbose
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit: coverage/junit.xml
    paths:
      - coverage/
      - coverage-api/
    expire_in: 30 days
  dependencies:
    - install_deps
  allow_failure: false

integration_tests:
  stage: test
  dependencies:
    - install_deps
  script:
    - echo "🔗 Executando testes de integração com APIs legais..."
    - echo "📋 Testando integração DJEN/DataJud..."
    - node scripts/test-djen-integration.js || echo "⚠️  Teste DJEN falhou, mas continuando..."
    - echo "📅 Testando integração Google Calendar..."
    - node scripts/test-calendar-integration.js || echo "⚠️  Teste Calendar falhou, mas continuando..."
    - echo "📝 Testando integração Todoist..."
    - node scripts/test-todoist-integration.js || echo "⚠️  Teste Todoist falhou, mas continuando..."
  artifacts:
    paths:
      - test-results/
    expire_in: 7 days
  allow_failure: true
  only:
    - main

security_scan:
  stage: security
  dependencies:
    - install_deps
  script:
    - npm audit --production --audit-level=moderate
  allow_failure: true
  only:
    - main

dependency_check:
  stage: security
  dependencies:
    - install_deps
  script:
    - npx license-checker --summary
  allow_failure: true
  only:
    - main

build:
  stage: build
  dependencies:
    - install_deps
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  only:
    - main

deploy_production:
  stage: deploy
  dependencies:
    - build
  script:
    - echo "✅ Build artifacts ready in dist/"
    - echo "📦 Total files:" && ls -1 dist/ | wc -l
    - echo "💾 Build size:" && du -sh dist/
  environment:
    name: production
    url: https://assistente-juridico-p.vercel.app
  only:
    - main
  when: on_success

# Jobs para agendamentos (schedules)
backup_data:
  stage: deploy
  script:
    - echo "💾 Executando backup automatizado..."
    - echo "📊 Tipo de agendamento: $SCHEDULE_TYPE"
    - echo "⏰ Retenção: $BACKUP_RETENTION dias"
    - node scripts/backup.js --type=$SCHEDULE_TYPE --retention=$BACKUP_RETENTION
    - echo "✅ Backup concluído com sucesso"
  environment:
    name: backup
  only:
    - schedules
  when: manual
  dependencies:
    - build

cleanup_cache:
  stage: deploy
  script:
    - echo "🧹 Executando limpeza de cache..."
    - npm cache clean --force
    - rm -rf node_modules/.cache
    - echo "✅ Cache limpo com sucesso"
  only:
    - schedules
  when: manual
