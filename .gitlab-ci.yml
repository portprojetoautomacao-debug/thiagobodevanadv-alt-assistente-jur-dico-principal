# GitLab CI/CD - Configuração Simplificada e Compatível
# Resolve conflitos entre múltiplas configurações CI/CD
# Foco: SAST (Static Application Security Testing) funcional

stages:
  - security
  - test
  - build

# Configurações globais para Node.js/React
variables:
  NODE_VERSION: "22"
  NODE_ENV: "production"
  PROJECT_TYPE: "nodejs"
  PROJECT_LANGUAGE: "typescript"
  PROJECT_FRAMEWORK: "react"

# Cache para dependências Node.js
cache:
  key: "npm-cache-${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm/
    - node_modules/

# ===== SAST (Static Application Security Testing) =====
# Configuração específica para resolver "No valid project detected"

include:
  # SAST padrão do GitLab para projetos Node.js
  - template: Security/SAST.gitlab-ci.yml

# Job adicional: SAST customizado para React/TypeScript
sast-custom:
  stage: security
  image: node:${NODE_VERSION}
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🔍 Executando SAST customizado para React/TypeScript..."
    - |
      # Verificar vulnerabilidades de segurança no código
      if grep -r "eval(\|innerHTML\|document\.write" src/ --include="*.ts" --include="*.tsx" | grep -v node_modules; then
        echo "🚨 Código perigoso detectado (XSS potencial)!"
        exit 1
      else
        echo "✅ Nenhum código XSS detectado"
      fi
    - |
      # Verificar uso de bibliotecas desatualizadas
      OUTDATED=$(npm outdated --json 2>/dev/null | jq 'length' 2>/dev/null || echo "0")
      if [ "$OUTDATED" -gt "10" ]; then
        echo "⚠️ Muitas dependências desatualizadas: $OUTDATED"
        npm outdated
      else
        echo "✅ Dependências atualizadas"
      fi
  artifacts:
    reports:
      sast: sast-report.json
    paths:
      - sast-report.json
    expire_in: 1 week
  allow_failure: true

# ===== TESTES =====

test:
  stage: test
  image: node:${NODE_VERSION}
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🧪 Executando testes..."
    - npm run test:run
    - npm run test:api
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit: coverage/junit-report.xml
    paths:
      - coverage/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# ===== BUILD =====

build:
  stage: build
  image: node:${NODE_VERSION}
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "🏗️ Construindo aplicação..."
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - merge_requests
    - main
    - develop
# ===== CONFIGURAÇÕES DE PROJETO =====
# Para ajudar o GitLab a detectar corretamente o tipo de projeto

# Indicador explícito do tipo de projeto (já definido nas variáveis globais acima)
# PROJECT_TYPE: nodejs
# PROJECT_LANGUAGE: typescript
# PROJECT_FRAMEWORK: react
