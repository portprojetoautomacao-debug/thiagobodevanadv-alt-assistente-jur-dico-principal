image: node:22

# Variáveis globais
variables:
  NODE_ENV: "production"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  GIT_DEPTH: 10

# Cache otimizado
cache:
  key: 
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/
  policy: pull

stages:
  - install
  - test
  - security
  - build
  - deploy

# Template para jobs de teste
.test_template: &test_template
  stage: test
  dependencies:
    - install_deps
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Install dependencies
install_deps:
  stage: install
  cache:
    key: 
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
    when: on_success

# Lint code
lint:
  <<: *test_template
  script:
    - npm run lint
  allow_failure: false

# Run unit tests
unit_tests:
  <<: *test_template
  script:
    - npm test -- --run --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days

# Security scan
security_scan:
  stage: security
  dependencies:
    - install_deps
  script:
    - npm audit --production --audit-level=moderate
  allow_failure: true
  only:
    - main
    - merge_requests

# Dependency check
dependency_check:
  stage: security
  dependencies:
    - install_deps
  script:
    - npx license-checker --summary
  allow_failure: true

# Build the application
build:
  stage: build
  dependencies:
    - install_deps
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
    when: on_success
  only:
    - main
    - merge_requests

# Deploy to staging (preview)
deploy_preview:
  stage: deploy
  dependencies:
    - build
  script:
    - echo "Deploying to preview environment..."
    - echo "Preview URL would be generated here"
  environment:
    name: preview/$CI_COMMIT_REF_NAME
    url: https://preview-$CI_COMMIT_REF_SLUG.assistente-juridico-p.vercel.app
    on_stop: stop_preview
    auto_stop_in: 1 day
  only:
    - merge_requests

# Stop preview environment
stop_preview:
  stage: deploy
  script:
    - echo "Stopping preview environment..."
  environment:
    name: preview/$CI_COMMIT_REF_NAME
    action: stop
  when: manual
  only:
    - merge_requests

# Deploy to production
deploy_production:
  stage: deploy
  dependencies:
    - build
  script:
    - echo "Deploying to production..."
    - echo "Production deployment would happen here"
  environment:
    name: production
    url: https://assistente-juridico-p.vercel.app
  only:
    - main
  when: manual
