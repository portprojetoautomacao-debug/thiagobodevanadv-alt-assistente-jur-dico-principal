# SonarCloud configuration for this repo (Python-only)
sonar.host.url=https://sonarcloud.io
sonar.organization=portprojetoautomacao-debug
sonar.projectKey=portprojetoautomacao-debug_thiagobodevanadv-alt-assistente-jur-dico-principal

# Sources and tests
sonar.sources=streamlit-app
sonar.tests=streamlit-app/tests

# Language settings
sonar.language=py
sonar.python.version=3.11

# Exclusions (keep analysis focused and avoid virtualenv/artefacts)
sonar.exclusions=**/.venv/**,**/__pycache__/**,.git/**,**/*.pyc,**/.pytest_cache/**,**/.mypy_cache/**
sonar.test.exclusions=**/.venv/**,**/__pycache__/**,.git/**,**/*.pyc,**/.pytest_cache/**,**/.mypy_cache/**

# If you generate coverage, point to the XML file (optional)
# sonar.python.coverage.reportPaths=coverage.xml
