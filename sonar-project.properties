sonar.projectKey=thiagobodevan-a11y_assistente-juridico-p
sonar.organization=thiagobodevan-a11y

# Project info
sonar.projectName=Assistente Jurídico PJe
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src,api
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions - arquivos gerados, scripts de configuração, e dependências
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/coverage/**,\
  **/__mocks__/**,\
  **/public/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/*.min.js,\
  **/*.bundle.js,\
  **/Coverage-*.json,\
  **/*.sh,\
  scripts/**,\
  *.sh

# TypeScript/JavaScript configuration
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage-api/lcov.info
sonar.typescript.lcov.reportPaths=coverage-api/lcov.info
# Removido sonar.testExecutionReportPaths - formato incompatível com SonarCloud Generic Test Data
# Se precisar, gere relatório no formato: https://docs.sonarsource.com/sonarcloud/enriching/test-coverage/generic-test-data/
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/*.config.ts,**/*.config.js

# Language configuration
sonar.language=ts,js
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# SCM and links
sonar.links.homepage=https://github.com/thiagobodevan-a11y/assistente-juridico-p
sonar.links.ci=https://github.com/thiagobodevan-a11y/assistente-juridico-p/actions
sonar.links.scm=https://github.com/thiagobodevan-a11y/assistente-juridico-p
sonar.links.issue=https://github.com/thiagobodevan-a11y/assistente-juridico-p/issues

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Coverage exclusions (test files, configs, types)
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/types.ts,**/*.d.ts,vite.config.ts,eslint.config.js,playwright.config.cjs

# Duplicate exclusions
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/types.ts

# Language settings



# Scanner settings
sonar.scm.provider=git

# ===== PARÂMETROS DE CI/CD =====
# Estes parâmetros são usados APENAS pelo scanner no CI/CD, NÃO pelo SonarLint IDE

# Branch Analysis (branch principal)
# sonar.branch.name é passado automaticamente pelo GitHub Action
# Para forçar análise de long-lived branches:
# sonar.branch.longLivedBranches.regex=(main|develop|release-.*)

# PR Decoration (decoração de Pull Requests)
# Estes são passados automaticamente pelo sonarcloud-github-action:
# sonar.pullrequest.key=${PR_NUMBER}
# sonar.pullrequest.branch=${PR_SOURCE_BRANCH}
# sonar.pullrequest.base=${PR_TARGET_BRANCH}
# sonar.pullrequest.github.repository=thiagobodevan-a11y/assistente-juridico-p

# New Code Period (período de código novo)
# Definido no SonarCloud UI, mas pode ser sobrescrito:
# sonar.newCode.referenceBranch=main

# Coverage Reports (relatórios de cobertura)
# Já configurados acima:
# sonar.javascript.lcov.reportPaths=coverage-api/lcov.info

# External Issues (importar relatórios de outras ferramentas)
# sonar.externalIssuesReportPaths=eslint-report.json

# Build Info (informações da build)
# sonar.buildString=${BUILD_NUMBER} - passado pelo CI
