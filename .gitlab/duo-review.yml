# GitLab Duo Configuration
# Enable AI-powered code review and suggestions

duo:
  enabled: true
  code_review: true
  suggestions: true

# Code Review Settings
code_review:
  # Automatically request Duo review for MRs
  auto_review: true
  
  # Review focuses
  focus_on:
    - performance
    - security
    - maintainability
    - test_coverage
    - documentation
  
  # File patterns to review
  include_patterns:
    - '**/*.ts'
    - '**/*.tsx'
    - '**/*.js'
    - '**/*.jsx'
    - '**/*.py'
    - '**/*.rb'
  
  # Skip review for these patterns
  exclude_patterns:
    - '**/*.d.ts'
    - '**/dist/**'
    - '**/node_modules/**'
    - '**/build/**'

# Features
features:
  explain_code: true
  refactor_suggestions: true
  test_generation: true
  documentation_generation: true
  fix_suggestions: true
  security_analysis: true
  performance_analysis: true

# Merge Request Configuration
merge_requests:
  # Request Duo review automatically
  request_duo_review: true
  
  # Require Duo review before merge
  require_duo_approval: false
  
  # Comment with suggestions
  auto_comment: true
  
  # Labels for Duo-reviewed MRs
  labels:
    - 'duo-reviewed'
    - 'ai-reviewed'
