# ========================================
# 🔍 SONARQUBE CLOUD - ANÁLISE AUTOMÁTICA
# ========================================

# Informações do Projeto
sonar.projectKey=portprojetoautomacao-debug_thiagobodevanadv-alt-assistente-jur-dico-principal
sonar.organization=portprojetoautomacao-debug

# ========================================
# 📁 CAMINHOS DE CÓDIGO FONTE
# ========================================

# Diretórios contendo código fonte para análise
sonar.sources=src,api

# Codificação do código fonte
sonar.sourceEncoding=UTF-8

# ========================================
# 🧪 CAMINHOS DE TESTES
# ========================================

# Diretórios contendo testes
sonar.tests=tests,src

# Incluir apenas arquivos de teste
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.test.js,**/*.spec.js

# ========================================
# 🚫 EXCLUSÕES GLOBAIS
# ========================================

# Arquivos e diretórios excluídos da análise
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/__mocks__/**,\
  **/public/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/*.min.js,\
  **/*.bundle.js,\
  **/*.sh,\
  **/scripts/**,\
  **/docs/**,\
  **/*.html,\
  **/__azurite_db_*.json,\
  **/vite.config.*.timestamp-*,\
  **/.vscode/**,\
  **/.github/**,\
  **/vercel.json,\
  **/tsconfig.*.json

# Exclusões de testes (não analisar como código fonte)
sonar.test.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.js,\
  **/*.spec.js

# ========================================
# 📊 DETECÇÃO DE DUPLICAÇÃO
# ========================================

# Exclusões para detecção de copiar/colar
# UI components (shadcn) e arquivos gerados podem ter duplicação legítima
sonar.cpd.exclusions=\
  **/src/components/ui/**,\
  **/dist/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# ========================================
# 🎯 TYPESCRIPT/JAVASCRIPT
# ========================================

# Configuração TypeScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Usar TSConfig para resolução de tipos
sonar.typescript.tsconfigPath=tsconfig.json

# ========================================
# 📈 COBERTURA DE TESTES
# ========================================

# Caminho para relatórios de cobertura
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/src/components/ui/**,\
  **/__mocks__/**,\
  **/tests/**

# ========================================
# ⚙️ CONFIGURAÇÕES AVANÇADAS
# ========================================

# Número de threads para análise paralela
# sonar.scm.provider=git

# Ignorar problemas em arquivos gerados
sonar.issue.ignore.multicriteria=e1,e2,e3

# e1: Ignorar todos os problemas em arquivos UI do shadcn
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/src/components/ui/**

# e2: Ignorar problemas de segurança em arquivos de teste
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.*

# e3: Ignorar problemas em arquivos de configuração
sonar.issue.ignore.multicriteria.e3.ruleKey=*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.config.*

# ========================================
# 🔐 ANÁLISE DE SEGURANÇA
# ========================================

# Habilitar análise de segurança
sonar.security.hotspots.enabled=true

# ========================================
# 📝 COMENTÁRIOS E DOCUMENTAÇÃO
# ========================================

# Ignorar comentários TODO/FIXME (já gerenciados via GitHub Issues)
# sonar.issue.ignore.allfile.suppressComments=TODO,FIXME

# ========================================
# 🎨 NOVO CÓDIGO (Clean as You Code)
# ========================================

# Período de definição de novo código (padrão: 30 dias)
# sonar.leak.period=30

# ========================================
# 🚀 OTIMIZAÇÕES DE PERFORMANCE
# ========================================

# Desabilitar análise de arquivos binários
sonar.scm.disabled=false

# Logs de debug (desabilitar em produção)
# sonar.verbose=false
