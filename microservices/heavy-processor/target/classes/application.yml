# Spring Boot Configuration
spring:
  application:
    name: heavy-processor
  threads:
    virtual:
      enabled: true

  # Server configuration
  server:
    port: 8080

  # Actuator endpoints
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics
    endpoint:
      health:
        show-details: always

# Logging
logging:
  level:
    root: INFO
    br.jus.pje.assistente: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# CORS Configuration (para desenvolvimento)
cors:
  allowed-origins:
    - http://localhost:5173
    - https://assistente-juridico-github.vercel.app
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

# Azure Storage Configuration
azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME:process-documents}
